<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060930">
<title>Mercante · Fambit Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Sulphur+Point:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A128A; --lila:#5852F2; --lila2:#8F8BFF; --azul:#2643E9; --naranja:#FFA800; --amarillo:#FFD42E;
  --bg:#060930; --card:#0F1350; --card2:#151A62; --line:rgba(196,198,245,.14); --tinta:#F5F4FF; --tinta2:#C4C6F5; --tinta3:#8A8DC7;
  --ok:#2BD67B; --mal:#FF5C7A;
  --titulo:'Comfortaa',system-ui,sans-serif; --texto:'Sulphur Point',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;color:var(--tinta);font-family:var(--texto);font-size:15px;
  background:radial-gradient(ellipse 80% 40% at 50% 0%, rgba(88,82,242,.22), transparent 70%),var(--bg);padding-bottom:110px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,.tt{font-family:var(--titulo);font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* encabezado */
.top{position:sticky;top:0;z-index:10;background:rgba(6,9,48,.97);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.volver{display:flex;align-items:center;gap:6px;color:var(--tinta2);text-decoration:none;font-size:13px;padding:8px 10px 8px 6px;border-radius:10px}
.volver:hover{background:rgba(255,255,255,.05)}
.top h1{font-size:18px;line-height:1}
.top h1 span{color:var(--amarillo)}
.top p{font-size:12px;color:var(--tinta3);margin-top:3px}
.top .sp{flex:1}
.ico-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer}
.ico-btn:hover{background:rgba(255,255,255,.05)}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--titulo);font-size:18px}
.stat span{font-size:11px;color:var(--tinta3);letter-spacing:.3px}
.stat.am b{color:var(--amarillo)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--tinta2);cursor:pointer;font-family:var(--titulo);font-weight:700}
.chip.on{background:var(--lila);border-color:var(--lila);color:#fff}
.chip i{font-style:normal;opacity:.7;margin-left:4px}
.buscar{width:100%;margin:10px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
.buscar:focus{border-color:var(--lila2)}

/* tarjetas de pedido */
.pedido{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,transform .15s}
.pedido:hover{border-color:rgba(143,139,255,.45)}
.pedido:active{transform:scale(.99)}
.p-top{display:flex;align-items:center;gap:8px}
.p-num{font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--tinta3)}
.p-cli{font-family:var(--titulo);font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-total{font-family:var(--titulo);font-weight:700;font-size:15px}
.p-mid{display:flex;align-items:center;gap:10px;margin:10px 0}
.thumbs{display:flex}
.thumbs img,.thumbs .mas{width:34px;height:34px;object-fit:contain;background:#1B2070;border-radius:9px;border:2px solid var(--card);margin-left:-8px}
.thumbs img:first-child{margin-left:0}
.thumbs .mas{display:grid;place-items:center;font-size:11px;font-family:var(--titulo);font-weight:700;color:var(--tinta2)}
.p-items{font-size:13px;color:var(--tinta2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-family:var(--titulo);font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.2px}
.e-nuevo{background:rgba(143,139,255,.18);color:var(--lila2)}
.e-pagado{background:rgba(38,67,233,.25);color:#9DB0FF}
.mini{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;font-family:var(--titulo);font-weight:700;color:var(--amarillo);cursor:pointer}
.mini:hover{background:rgba(255,212,46,.08)}
.grupo{font-family:var(--titulo);font-weight:700;font-size:12px;letter-spacing:.6px;color:var(--tinta3);text-transform:uppercase;margin:16px 2px 8px}
.e-forja{background:rgba(255,168,0,.16);color:var(--naranja)}
.e-listo{background:rgba(255,212,46,.16);color:var(--amarillo)}
.e-entregado{background:rgba(43,214,123,.14);color:var(--ok)}
.e-cancelado{background:rgba(255,92,122,.14);color:var(--mal)}
.g-pend{background:rgba(255,92,122,.12);color:#FF9DB0}
.g-abono{background:rgba(255,168,0,.12);color:#FFC768}
.g-pago{background:rgba(43,214,123,.12);color:#7DEBB0}
.p-meta{font-size:12px;color:var(--tinta3);margin-left:auto}
.vacio{text-align:center;padding:48px 20px;color:var(--tinta3)}
.vacio h3{color:var(--tinta);font-size:17px;margin:10px 0 6px}

.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:15;background:var(--amarillo);color:var(--navy);border:none;border-radius:18px;padding:16px 20px;font-family:var(--titulo);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.fab:active{transform:scale(.97)}

/* hojas / paneles */
.velo{position:fixed;inset:0;background:rgba(3,5,30,.72);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:50%;bottom:0;width:min(760px,100%);max-height:94vh;overflow-y:auto;background:#0B0F45;border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;z-index:31;transform:translate(-50%,104%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility .32s;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.hoja.on{transform:translate(-50%,0);visibility:visible}
.h-cab{position:sticky;top:0;background:#0B0F45;z-index:2;padding:12px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.h-cab h2{font-size:17px;flex:1}
.h-cuerpo{padding:16px 18px}
.sec{margin-bottom:18px}
.sec>label,.lbl{display:block;font-size:12px;color:var(--tinta3);letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase;font-weight:700}
.campo{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.campo:focus{border-color:var(--lila2)}
select.campo{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tinta2) 50%),linear-gradient(135deg,var(--tinta2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.canales{display:flex;flex-wrap:wrap;gap:6px}

/* selector de catálogo */
.cat-filtros{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.cat-filtros::-webkit-scrollbar{display:none}
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:260px;overflow-y:auto;padding:2px}
.dis{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px 6px;text-align:center;cursor:pointer;position:relative;transition:border-color .15s,transform .1s}
.dis:active{transform:scale(.96)}
.dis img{width:52px;height:52px;object-fit:contain;display:block;margin:0 auto 4px}
.dis span{font-size:11px;line-height:1.15;display:block;color:var(--tinta2)}
.dis .n{position:absolute;top:4px;right:4px;background:var(--amarillo);color:var(--navy);font-family:var(--titulo);font-weight:700;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.dis.sel{border-color:var(--amarillo)}
.dis.perso{display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed}
.dis.perso b{font-size:22px;color:var(--amarillo);line-height:1;margin-bottom:6px}

/* items */
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.item img,.item .ph{width:44px;height:44px;object-fit:contain;background:#1B2070;border-radius:10px}
.item .ph{display:grid;place-items:center;color:var(--amarillo);font-size:20px}
.item .nm{font-family:var(--titulo);font-weight:700;font-size:14px}
.item .sub{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.item select,.item input.pr{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12px;outline:none}
.item input.pr{width:84px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:none;background:transparent;border-radius:8px;padding:5px 10px;font-size:12px;font-family:var(--titulo);font-weight:700;color:var(--tinta3);cursor:pointer}
.seg button.on{background:var(--lila);color:#fff}
.item input.txt{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:13px;outline:none;width:100%}
.cant{display:flex;align-items:center;gap:4px}
.cant button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:16px}
.cant input{width:42px;text-align:center;background:transparent;border:none;font-family:var(--titulo);font-weight:700;outline:none}
.item .der{text-align:right}
.item .der b{font-family:var(--titulo);font-size:14px;display:block;margin-top:6px}
.aviso{font-size:12px;color:var(--naranja);margin-top:4px}
.tramo{font-size:11px;color:var(--ok);font-family:var(--titulo);font-weight:700}

/* totales */
.totales{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.t-fila{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px;color:var(--tinta2)}
.t-fila.big{font-family:var(--titulo);font-weight:700;color:var(--tinta);font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.t-fila input{width:110px;text-align:right;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;outline:none}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.sw input{width:18px;height:18px;accent-color:var(--lila)}
.gratis{color:var(--ok);font-family:var(--titulo);font-weight:700;font-size:13px}

.btn{border:none;border-radius:14px;padding:14px 16px;font-family:var(--titulo);font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn:active{transform:scale(.99)}
.btn.am{background:var(--amarillo);color:var(--navy)}
.btn.li{background:var(--lila);color:#fff}
.btn.sec2{background:transparent;border:1px solid var(--line);color:var(--tinta2)}
.btn.wa{background:#1FAF5B;color:#fff}
.btn.mal{background:transparent;border:1px solid rgba(255,92,122,.4);color:var(--mal)}
.acciones{display:grid;gap:8px;margin-top:14px}
.err{color:var(--mal);font-size:13px;margin-top:6px;display:none}
.err.on{display:block}

/* detalle */
.d-cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.d-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.d-info div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.d-info small{display:block;font-size:11px;color:var(--tinta3);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.d-info span{font-size:14px}
.pasos{display:flex;gap:4px;margin:6px 0 4px}
.paso{flex:1;text-align:center;font-size:11px;font-family:var(--titulo);font-weight:700;color:var(--tinta3);padding:8px 2px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.paso.hecho{color:var(--tinta);background:rgba(88,82,242,.28);border-color:rgba(143,139,255,.4)}
.paso.act{background:var(--lila);color:#fff;border-color:var(--lila)}
.abono-row{display:flex;gap:8px;margin-top:10px}
.abono-row input{flex:1}
.abono-row .btn{width:auto;padding:11px 16px;font-size:14px}
.hist{font-size:12px;color:var(--tinta3);margin-top:8px;line-height:1.6}

/* ajustes */
.aj-prod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.aj-prod h3{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.aj-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.aj-grid label{font-size:10px;color:var(--tinta3);display:block;margin-bottom:3px;text-transform:uppercase;font-weight:700}
.aj-grid input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 6px;font-size:13px;outline:none}
@media(max-width:520px){.aj-grid{grid-template-columns:repeat(3,1fr)}}
.nota{font-size:12px;color:var(--tinta3);line-height:1.5;margin-top:6px}

.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-90px);background:#fff;color:#14174A;font-family:var(--titulo);font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;transition:transform .3s}
.toast.on{transform:translate(-50%,0)}

/* ===== v2: estructura tipo COSMO ===== */
body{padding-bottom:40px}
.tabs-wrap{padding-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:none}
.tab{border:1px solid var(--line);background:transparent;color:var(--tinta2);border-radius:12px;padding:9px 16px;font-family:var(--titulo);font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:var(--amarillo);border-color:var(--amarillo);color:var(--navy)}
.tab-n{margin-left:6px;font-size:11px;background:rgba(10,18,138,.15);border-radius:999px;padding:1px 7px}
.tab:not(.on) .tab-n{background:rgba(255,255,255,.08)}
.vista{display:none}.vista.on{display:block}
.titulo{margin:18px 0 14px}.titulo h2{font-size:22px}.titulo p{color:var(--tinta3);font-size:14px;margin-top:4px}
main.wrap{max-width:1080px}
.top .wrap,.tabs-wrap{max-width:1080px}

/* editor (nuevo y edición) */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols>div,.card{min-width:0}
.fila{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.campo{min-width:0}
@media(max-width:480px){.f-art{display:none}.f-acc{flex-wrap:nowrap}.est-sel,.pago-pill{font-size:11px}.f-acc .ico-s.cot{margin-left:auto}}
html,body{overflow-x:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card-t{font-family:var(--titulo);font-weight:700;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-t i{font-style:normal;width:26px;height:26px;border-radius:8px;background:rgba(88,82,242,.25);display:grid;place-items:center;font-size:13px}
.campo-w{margin-bottom:10px}
.campo-w label{display:block;font-size:12px;color:var(--tinta3);margin-bottom:5px;font-weight:700}
.resumen{position:sticky;top:130px}
@media(max-width:860px){.resumen{position:static}}
.r-lin{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--tinta2);padding:4px 0}
.r-lin span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-ctrl{display:grid;grid-template-columns:80px 1fr 110px;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--tinta2)}
.r-ctrl input,.r-ctrl select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;width:100%}
.r-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.r-total span{font-family:var(--titulo);font-weight:700}
.r-total b{font-family:var(--titulo);font-size:26px;color:var(--amarillo)}
.r-hint{font-size:12px;color:var(--ok);margin-top:6px;cursor:pointer}
.r-sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pills.p3{grid-template-columns:repeat(3,1fr)}
.pl{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 2px;font-size:11px;font-family:var(--titulo);font-weight:700;color:var(--tinta3);cursor:pointer;line-height:1.3}
.pl.on{color:#fff}

/* lista */
.contadores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cont{flex:1;min-width:92px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left}
.cont b{display:block;font-family:var(--titulo);font-size:20px}
.cont span{font-size:11px;color:var(--tinta3);font-weight:700}
.cont.on{background:var(--card2)}
.cont.saldo{flex:0 0 auto}
.fila-p{display:grid;grid-template-columns:4px auto 1fr auto;gap:10px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 0;margin-bottom:8px;overflow:hidden}
.fila-p .barra{align-self:stretch;border-radius:0 3px 3px 0}
.gear{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--tinta2);font-size:18px;cursor:pointer;display:grid;place-items:center;transition:transform .25s,border-color .2s}
.gear:hover{transform:rotate(45deg);border-color:var(--lila2);color:#fff}
.f-info{min-width:0}
.f-nom{font-family:var(--titulo);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-nom small{font-size:11px;color:var(--tinta3);margin-left:6px;font-weight:700}
.f-sub{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--tinta3);min-width:0}
.f-sub .thumbs img,.f-sub .thumbs .mas{width:26px;height:26px;border-radius:7px}
.f-sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-tot{text-align:right}
.f-tot b{font-family:var(--titulo);font-size:16px;display:block}
.f-tot small{font-size:11px;color:var(--tinta3)}
.f-acc{grid-column:2/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.est-sel{appearance:none;border-radius:999px;padding:6px 26px 6px 12px;font-family:var(--titulo);font-weight:700;font-size:12px;cursor:pointer;outline:none;border:1.5px solid;background-repeat:no-repeat;background-position:calc(100% - 10px) 50%;background-size:8px 5px}
.est-sel option{background:#0B0F45;color:#fff}
.pago-pill{border-radius:999px;padding:6px 12px;font-family:var(--titulo);font-weight:700;font-size:12px;cursor:pointer;border:1.5px solid}
.f-art{font-size:12px;color:var(--tinta3);margin-left:auto}
.ico-s{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:15px;color:var(--tinta2)}
.ico-s:hover{background:rgba(255,255,255,.05)}
.ico-s.cot{color:var(--amarillo)}
.ico-s.del:hover,.ico-s.del.conf{border-color:rgba(255,92,122,.5);color:var(--mal)}
.ico-s.del.conf{width:auto;padding:0 10px;font-size:12px;font-family:var(--titulo);font-weight:700}

/* cajón lateral */
.cajon{position:fixed;top:0;right:0;height:100%;width:min(980px,96vw);background:#0B0F45;border-left:1px solid var(--line);z-index:31;transform:translateX(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.cajon.on{transform:translateX(0)}
@media(max-width:640px){.cajon{width:100vw}}
.c-cab{position:sticky;top:0;z-index:2;background:#0B0F45;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px}
.c-cab h2{flex:1;font-size:17px}
.c-cuerpo{padding:16px 18px 30px}
.cajon .resumen{top:76px}

/* fecha de entrega en la lista */
.f-fecha{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:12px;font-family:var(--titulo);font-weight:700;color:var(--tinta2);cursor:pointer;white-space:nowrap}
.f-fecha.venc{color:var(--mal);border-color:rgba(255,92,122,.45)}
.f-fecha.hoy{color:var(--amarillo);border-color:rgba(255,212,46,.45)}
.f-fecha.sin{color:var(--tinta3);border-style:dashed}
/* calendario */
.cal-cab{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.cal-cab h2{flex:1;font-size:20px;text-align:center}
.cal-nav{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tinta);font-size:20px;cursor:pointer}
.cal-hoy{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--amarillo);cursor:pointer}
.cal-ley{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--tinta3);margin-bottom:12px}
.cal-ley i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-dow{text-align:center;font-size:11px;font-family:var(--titulo);font-weight:700;color:var(--tinta3);padding:4px 0}
.cal-cel{min-height:104px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-cel.otro{opacity:.35}
.cal-cel.hoy{border-color:var(--amarillo)}
.cal-cel.sel{background:var(--card2);border-color:var(--lila2)}
.cal-num{font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--tinta2)}
.cal-cel.hoy .cal-num{color:var(--amarillo)}
.cal-ev{font-size:11px;border-radius:6px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;border-left:3px solid}
.cal-mas{font-size:11px;color:var(--tinta3);font-weight:700}
.cal-dots{display:none;gap:3px;flex-wrap:wrap}
.cal-dots i{width:7px;height:7px;border-radius:50%}
@media(max-width:640px){.cal-cel{min-height:58px;padding:5px}.cal-ev,.cal-mas{display:none}.cal-dots{display:flex}}
.cal-dia{margin-top:16px}
.cal-dia h3{font-size:15px;margin:0 2px 10px}
.ev-fila{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid;border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.ev-fila b{font-family:var(--titulo);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-fila small{font-size:12px;color:var(--tinta3)}
/* sincronización */
.sync{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 10px;font-size:11px;font-family:var(--titulo);font-weight:700;color:var(--tinta3);cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--tinta3)}
.sync.ok i{background:var(--ok)}.sync.run i{background:var(--amarillo);animation:pulsoS 1s infinite}.sync.err i{background:var(--mal)}.sync.off i{background:#888}
@keyframes pulsoS{50%{opacity:.3}}
@media(max-width:420px){.sync span{display:none}}
/* métricas */
.met-sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.met-sec h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.met-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:600px){.met-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.met-k{background:var(--card2);border-radius:14px;padding:12px}
.met-k b{display:block;font-family:var(--titulo);font-size:20px}
.met-k span{font-size:11px;color:var(--tinta3);font-weight:700}
.met-k small{display:block;font-size:11px;margin-top:4px;color:var(--tinta3)}
.met-big{display:flex;align-items:center;gap:16px}
.met-anillo{width:96px;height:96px;flex:none}
.met-big p{font-size:13px;color:var(--tinta2);line-height:1.6}
.met-vacio{font-size:13px;color:var(--tinta3)}
/* top 10 */
.top-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:760px){.top-cols{grid-template-columns:minmax(0,1fr)}}
.rk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:none}
.rk-n{width:26px;text-align:center;font-family:var(--titulo);font-weight:700;font-size:14px;color:var(--tinta3);flex:none}
.rk-n.m1{color:#FFD42E}.rk-n.m2{color:#C4C6F5}.rk-n.m3{color:#FFA800}
.rk img{width:40px;height:40px;object-fit:contain;background:var(--card2);border-radius:10px;flex:none}
.rk-i{flex:1;min-width:0}
.rk-i b{font-family:var(--titulo);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-bar{height:6px;border-radius:3px;background:var(--card2);margin-top:5px;overflow:hidden}.rk-bar i{display:block;height:100%;border-radius:3px}
.rk-v{text-align:right;flex:none}.rk-v b{font-family:var(--titulo);font-size:14px;display:block}.rk-v small{font-size:11px;color:var(--tinta3)}
.seg-top{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg-top button{border:none;background:transparent;border-radius:9px;padding:7px 12px;font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--tinta3);cursor:pointer}
.seg-top button.on{background:var(--lila);color:#fff}
.sin-v{display:flex;flex-wrap:wrap;gap:6px}
.sin-v span{display:flex;align-items:center;gap:5px;background:var(--card2);border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;color:var(--tinta2)}
.sin-v img{width:24px;height:24px;object-fit:contain}
/* cartera */
.deu{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.deu .ac-av{width:38px;height:38px}
.deu b{font-family:var(--titulo);font-size:14px;display:block}
.deu small{font-size:12px;color:var(--tinta3)}
.deu .mto{margin-left:auto;text-align:right}
.deu .mto b{color:#FF9DB0;font-size:15px}
.deu-peds{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.deu-peds button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 9px;font-size:11px;color:var(--tinta2);cursor:pointer;font-family:var(--titulo);font-weight:700}
.btn-cobrar{border:none;background:#1FAF5B;color:#fff;border-radius:10px;padding:8px 11px;font-family:var(--titulo);font-weight:700;font-size:12px;cursor:pointer;margin-top:6px}
/* cambios */
.raz-fechas{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border-radius:12px;padding:10px;margin-bottom:12px;font-family:var(--titulo);font-weight:700;font-size:14px}
.raz-fechas .ant{color:var(--tinta3);text-decoration:line-through}
.raz-fechas .nue{color:var(--amarillo)}
.cam{background:var(--card);border:1px solid var(--line);border-left:4px solid;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.cam-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cam-top b{font-family:var(--titulo);font-size:14px}
.cam-top small{font-size:12px;color:var(--tinta3)}
.cam-top .cuando{margin-left:auto;font-size:11px;color:var(--tinta3)}
.cam-det{font-size:13px;color:var(--tinta2);margin-top:6px}
.cam-raz{font-size:13px;margin-top:6px;background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px;color:var(--tinta)}
.cam-raz::before{content:'Razón: ';color:var(--tinta3);font-weight:700}
details.aud{margin-top:18px}details.aud summary{cursor:pointer;font-size:12px;color:var(--tinta3);font-family:var(--titulo);font-weight:700;margin-bottom:8px}
/* clientes */
.ac-wrap{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#121766;border:1px solid rgba(143,139,255,.4);border-radius:12px;z-index:20;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45);display:none}
.ac.on{display:block}
.ac-it{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.ac-it:last-child{border-bottom:none}
.ac-it:hover,.ac-it.act{background:rgba(88,82,242,.3)}
.ac-av{width:32px;height:32px;border-radius:50%;background:var(--lila);display:grid;place-items:center;font-family:var(--titulo);font-weight:700;font-size:12px;flex:none}
.ac-it b{font-family:var(--titulo);font-size:14px;display:block}
.ac-it b mark{background:none;color:var(--amarillo)}
.ac-it small{font-size:12px;color:var(--tinta3)}
.cli-ok{font-size:12px;color:var(--ok);margin-top:5px;font-family:var(--titulo);font-weight:700}
.cli-card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.cli-top{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.cli-top .ac-av{width:42px;height:42px;font-size:14px}
.cli-top b{font-family:var(--titulo);font-size:15px;display:block}
.cli-top small{font-size:12px;color:var(--tinta3)}
.cli-num{margin-left:auto;text-align:right}
.cli-num b{font-size:15px}
.cli-det{border-top:1px solid var(--line);padding:12px 14px;background:rgba(0,0,0,.12)}
.cli-favs{display:flex;gap:6px;margin:6px 0 12px}
.cli-favs div{background:var(--card2);border-radius:10px;padding:4px 8px 4px 4px;display:flex;align-items:center;gap:6px;font-size:12px}
.cli-favs img{width:28px;height:28px;object-fit:contain}
.tag-frec{font-size:10px;background:rgba(255,212,46,.15);color:var(--amarillo);border-radius:999px;padding:2px 8px;margin-left:6px;font-family:var(--titulo);font-weight:700;vertical-align:2px}
/* satisfacción */
.sat-res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
@media(max-width:520px){.sat-res{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sat-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.sat-card.lista{border-color:rgba(255,212,46,.45)}
.sat-head{display:flex;align-items:center;gap:12px}
.sat-nom{font-family:var(--titulo);font-weight:700;font-size:15px}
.sat-sub{font-size:12px;color:var(--tinta3);margin-top:3px}
.sat-esp{text-align:right}.sat-esp small{display:block;font-size:11px;color:var(--tinta3)}.sat-esp b{font-family:var(--titulo);font-size:18px;color:var(--lila2)}
.sat-bar{height:6px;border-radius:3px;background:var(--card2);margin-top:10px;overflow:hidden}.sat-bar i{display:block;height:100%;background:var(--lila);border-radius:3px}
.sat-cal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.sat-cal button{border:1.5px solid;background:transparent;border-radius:14px;padding:10px 4px;cursor:pointer;font-family:var(--titulo);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sat-cal button span{font-size:26px}
.evid{display:block;border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;font-size:12px;color:var(--tinta3);cursor:pointer;margin-top:10px}
.evid img{max-height:110px;max-width:100%;border-radius:8px}
.sat-ev{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.sat-ev .em{font-size:22px}
.sat-ev b{font-family:var(--titulo);font-size:14px;display:block}
.sat-ev small{font-size:12px;color:var(--tinta3)}
.sat-ev img{width:42px;height:42px;object-fit:cover;border-radius:8px;margin-left:auto;cursor:pointer}
/* modal pago */
.modal-velo{position:fixed;inset:0;z-index:50;background:rgba(3,5,30,.75);display:none;align-items:center;justify-content:center;padding:20px}
.modal-velo.on{display:flex}
.modal{background:#0B0F45;border:1px solid var(--line);border-radius:20px;padding:20px;width:min(380px,94vw)}
.modal h3{font-size:16px;margin-bottom:4px}
.modal p.sub{font-size:13px;color:var(--tinta3);margin-bottom:14px}

.top .tabs-wrap{height:auto;display:block}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="volver" href="index.html" aria-label="Volver al cuarto">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Cuarto</a>
  <div><h1>Mercante <span>·</span></h1><p>Pedidos y ventas</p></div>
  <div class="sp"></div>
  <button class="sync" id="syncDot" title="Sincronización" aria-label="Estado de sincronización"><i></i><span id="syncTxt">Local</span></button>
  <button class="ico-btn" id="btnAjustes" aria-label="Ajustes de precios">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C6F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>
<div class="wrap tabs-wrap"><nav class="tabs" id="tabs">
  <button class="tab on" data-tab="nuevo">+ Nuevo</button>

  <button class="tab" data-tab="clientes">Clientes<span class="tab-n" id="tabCli"></span></button>
  <button class="tab" data-tab="top">🏆 Top 10</button>
  <button class="tab" data-tab="metricas">📊 Métricas</button>
  <button class="tab" data-tab="cambios">📌 Cambios</button>
  <button class="tab" data-tab="satisfaccion">⭐ Satisfacción<span class="tab-n" id="tabSat"></span></button>
</nav></div>
</header>

<main class="wrap">
  <section class="vista on" id="vista-nuevo">
    <div class="titulo"><h2>Nuevo pedido</h2><p>Completa los datos del cliente y los productos.</p></div>
    <div id="edNuevo"></div>
  </section>

</main>

<!-- panel lateral de edición -->
<div class="velo" id="velo"></div>

</aside>

<section class="hoja" id="hAjustes" role="dialog" aria-modal="true">
  <div class="h-cab"><h2>Precios y ajustes</h2><button class="ico-btn" data-cerrar aria-label="Cerrar">✕</button></div>
  <div class="h-cuerpo" id="ajCuerpo"></div>
</section>

<div class="modal-velo" id="mPago"><div class="modal" id="mPagoCuerpo"></div></div>
<div class="modal-velo" id="mRazon" style="z-index:60"><div class="modal" id="mRazonCuerpo"></div></div>
<div class="modal-velo" id="mFecha"><div class="modal" id="mFechaCuerpo"></div></div>

<div class="toast" id="toast"></div>

function migrarV1(d){

  d.pedidos=(d.pedidos||[]).map(p=>{

    const q={...p,estado:mapE[p.estado]||'borrador',envio:typeof p.envio==='object'?p.envio:{tipo:p.envio?'incluido':'por_cobrar',monto:p.envio?+p.valorEnvio||0:0},desc:p.desc||{tipo:'pct',val:''},abonado:ab,estadoPago:ab>0?'abonado':'sin_pago'};

}

}

/* ================= SINCRONIZACIÓN (Firestore · colección fambit-hub) ================= */
/* Mismo esquema que COSMO: un documento por clave {data,updatedAt} + __manifest con la hora de cada clave.
   Cada dispositivo sube con debounce y bandeja de salida; baja cada 10 s y FUSIONA registro a registro
   (pedidos por id con lápidas de borrado), así dos personas pueden trabajar a la vez sin pisarse. */
const FB='https://firestore.googleapis.com/v1/projects/cosmo-98107/databases/(default)/documents/fambit-hub/';
const CORTE_KEY='fambit_mercante_cambios_corte';
const SYNC_KEYS=['fambit_mercante_v2','fambit_mercante_sat','fambit_mercante_cambios','fambit_mercante_auditoria',CORTE_KEY];
const OUTBOX='fambit_outbox';
const obLoad=()=>{try{return JSON.parse(localStorage.getItem(OUTBOX)||'{}')||{};}catch(e){return {};}};
const obSave=o=>{try{localStorage.setItem(OUTBOX,JSON.stringify(o));}catch(e){}};
const fbPend={},fbT={};
function lsSet(key,val){localStorage.setItem(key,val);if(SYNC_KEYS.includes(key))fbSave(key,val);}
function fbSave(key,val){const o=obLoad();o[key]={v:val,ts:Date.now()};obSave(o);fbPend[key]=val;clearTimeout(fbT[key]);fbT[key]=setTimeout(()=>fbFlush(key),900);syncDot('run');}
function fbFlush(key){
  let val;if(key in fbPend){val=fbPend[key];delete fbPend[key];}else{const o=obLoad();if(!o[key])return;val=o[key].v;}
  const ts=Date.now();
  return fetch(FB+encodeURIComponent(key)+'?updateMask.fieldPaths=data&updateMask.fieldPaths=updatedAt',{method:'PATCH',headers:{'Content-Type':'application/json'},keepalive:true,
    body:JSON.stringify({fields:{data:{stringValue:val},updatedAt:{integerValue:String(ts)}}})})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);localStorage.setItem('__ts_'+key,String(ts));
    const o=obLoad();if(o[key]&&o[key].v===val){delete o[key];obSave(o);}
    return fetch(FB+'__manifest?updateMask.fieldPaths='+encodeURIComponent(key),{method:'PATCH',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({fields:{[key]:{integerValue:String(ts)}}})});})
  .then(()=>{if(!Object.keys(obLoad()).length)syncDot('ok');})
  .catch(()=>{syncDot(navigator.onLine===false?'off':'err');});
}
function fbFlushAll(){Object.keys(obLoad()).forEach(fbFlush);}
/* fusiones */
const tPed=p=>Date.parse(p.actualizado||p.creado||0)||0;
function fusionPed(L,Rm){
  L=L||{};Rm=Rm||{};const lim=Date.now()-60*864e5;
  const del={};[...(L.del||[]),...(Rm.del||[])].forEach(d=>{if(d&&d.id&&(!del[d.id]||d.ts>del[d.id].ts))del[d.id]=d;});
  const map={};[...(Rm.pedidos||[]),...(L.pedidos||[])].forEach(p=>{if(!p||!p.id)return;if(!map[p.id]||tPed(p)>tPed(map[p.id]))map[p.id]=p;});
  const pedidos=Object.values(map).filter(p=>!(del[p.id]&&del[p.id].ts>=tPed(p)));
  const aj=((Rm.ajustes||{}).ts||0)>((L.ajustes||{}).ts||0)?Rm.ajustes:(L.ajustes||Rm.ajustes);
  /* números de pedido únicos: si dos dispositivos crearon el mismo FB-00X a la vez, el más reciente se renumera (igual en todos) */
  const nNum=p=>parseInt(String(p.num||'').replace(/\D/g,''),10)||0;
  let seq=Math.max(L.seq||0,Rm.seq||0,...pedidos.map(nNum));const usados=new Set();
  [...pedidos].sort((a,b)=>(a.creado||'').localeCompare(b.creado||'')||a.id.localeCompare(b.id)).forEach(p=>{
    if(usados.has(p.num)){seq++;p.num='FB-'+String(seq).padStart(3,'0');p.actualizado=new Date(Math.max(tPed(p),Date.now())).toISOString();}usados.add(p.num);});
  return {pedidos,seq,ajustes:aj,del:Object.values(del).filter(d=>d.ts>lim)};
}
function fusionSat(L,Rm){const o={...(Rm||{})};Object.entries(L||{}).forEach(([k,v])=>{if(!o[k]||(v.ts||0)>=(o[k].ts||0))o[k]=v;});return o;}
function fusionLog(L,Rm,corte){const m={};[...(Rm||[]),...(L||[])].forEach(x=>{if(x&&x.id&&(x.ts||0)>(corte||0))m[x.id]=x;});return Object.values(m).sort((a,b)=>b.ts-a.ts);}
const firma=v=>JSON.stringify(v);
function fusionar(key,remStr){
  const locStr=localStorage.getItem(key);const J=t=>{try{return JSON.parse(t);}catch(e){return null;}};
  let out;
  if(key==='fambit_mercante_v2')out=fusionPed(J(locStr),J(remStr));
  else if(key==='fambit_mercante_sat')out=fusionSat(J(locStr),J(remStr));
  else if(key===CORTE_KEY)out=String(Math.max(+locStr||0,+remStr||0));
  else{const corte=+localStorage.getItem(CORTE_KEY)||0;out=fusionLog(J(locStr),J(remStr),corte);}
  const outStr=typeof out==='string'?out:firma(out);
  const cambioLocal=outStr!==(locStr||'');
  if(cambioLocal)localStorage.setItem(key,outStr);
  return {cambioLocal,subir:outStr!==remStr};
}
let fbPulling=false,fbLast=0;
function fbPull(force){
  if(fbPulling||(!force&&Date.now()-fbLast<3000))return Promise.resolve();
  fbPulling=true;fbLast=Date.now();syncDot('run');
  return fetch(FB+'__manifest').then(r=>r.ok?r.json():null).then(doc=>{
    const f=(doc&&doc.fields)||{};
    const jobs=SYNC_KEYS.map(k=>({k,ts:parseInt((f[k]||{}).integerValue||'0',10)})).filter(j=>j.ts>(parseInt(localStorage.getItem('__ts_'+j.k)||'0',10)));
    jobs.sort((a,b)=>(a.k===CORTE_KEY?-1:0)-(b.k===CORTE_KEY?-1:0));
    let hubo=false,cadena=Promise.resolve();
    jobs.forEach(j=>{cadena=cadena.then(()=>fetch(FB+encodeURIComponent(j.k)).then(r=>r.ok?r.json():null).then(d=>{
      const rem=d&&d.fields&&d.fields.data&&d.fields.data.stringValue;if(rem==null)return;
      const res=fusionar(j.k,rem);localStorage.setItem('__ts_'+j.k,String(j.ts));
      if(res.cambioLocal)hubo=true;if(res.subir)fbSave(j.k,localStorage.getItem(j.k));}).catch(()=>{}));});
    return cadena.then(()=>{if(hubo){DB=cargar();refrescarVistas();toast('☁️ Datos sincronizados');}
      /* primera vez en la nube: subir lo que haya local */
      if(!doc){SYNC_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!=null)fbSave(k,v);});}
      if(!Object.keys(obLoad()).length)syncDot('ok');});
  }).catch(()=>syncDot(navigator.onLine===false?'off':'err')).then(()=>{fbPulling=false;});
}

  renderLista();
  if(v==='vista-calendario')renderCal();if(v==='vista-clientes')renderClientes();if(v==='vista-satisfaccion')renderSat();
  if(v==='vista-cambios')renderCambios();if(v==='vista-metricas')renderMetricas();if(v==='vista-top')renderTop();

function syncDot(st){const b=document.getElementById('syncDot');if(!b)return;b.className='sync '+st;
  document.getElementById('syncTxt').textContent={ok:'Sincronizado',run:'Sincronizando',err:'Sin conexión',off:'Offline'}[st]||'Local';}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')fbFlushAll();else fbPull(true);});
window.addEventListener('focus',()=>fbPull());
window.addEventListener('online',()=>{fbFlushAll();fbPull(true);});
window.addEventListener('offline',()=>syncDot('off'));
window.addEventListener('beforeunload',fbFlushAll);
setInterval(()=>{if(document.visibilityState==='visible')fbPull();},10000);

function infoEntrega(p){
  if(!p.entrega)return {txt:'Sin fecha',cls:'sin'};
  const f=new Date(p.entrega+'T00:00:00'),h=new Date();h.setHours(0,0,0,0);
  const corto=f.getDate()+' '+MESES[f.getMonth()].slice(0,3).toLowerCase();
  if(p.estado==='entregado')return {txt:corto,cls:''};
  const d=Math.round((f-h)/864e5);
  if(d<0)return {txt:corto+' · '+Math.abs(d)+'d vencido',cls:'venc'};
  if(d===0)return {txt:'Hoy',cls:'hoy'};
  if(d<=2)return {txt:corto+' · ⚠ '+d+'d',cls:'hoy'};
  return {txt:corto+' · '+d+'d',cls:''};
}

/* ================= PRECIOS ================= */
function precioUnit(prod,cantTipo){
  const p=DB.ajustes.precios[prod]||{};let base=num(p.detal),tramo=null;
  for(const t of TRAMOS){if(cantTipo>=t.min&&cantTipo<=t.max&&num(p[t.k])>0){base=num(p[t.k]);tramo=t;}}
  return {precio:base,tramo};
}
function calcular(ped){
  const porTipo={};(ped.items||[]).forEach(it=>porTipo[it.prod]=(porTipo[it.prod]||0)+num(it.cant));
  let sub=0;const det=(ped.items||[]).map(it=>{
    const {precio,tramo}=precioUnit(it.prod,porTipo[it.prod]);
    const unit=it.manual!==''&&it.manual!=null?num(it.manual):precio;
    const tot=unit*num(it.cant);sub+=tot;return {...it,unit,tramo,tot,auto:precio};
  });
  const d=ped.desc||{};const descuento=Math.min(sub,d.tipo==='fijo'?num(d.val):sub*num(d.val)/100);
  const productos=sub-descuento;
  const e=ped.envio||{tipo:'por_cobrar',monto:0};
  const envio=e.tipo==='incluido'?num(e.monto):0;
  const total=productos+envio;
  const ep=ped.estadoPago||'sin_pago';
  const pagado=ep==='pagado'?total:ep==='abonado'?Math.min(num(ped.abonado),total):0;
  return {det,sub,descuento,productos,envio,envioTipo:e.tipo,envioGratis:e.tipo==='gratis',total,pagado,saldo:Math.max(0,total-pagado),unidades:det.reduce((a,i)=>a+num(i.cant),0)};
}
const sugiereGratis=(ped,c)=>c.productos>=num(DB.ajustes.envioGratisDesde)&&(ped.envio||{}).tipo!=='gratis';

function senalItems(){
  let L=[];try{L=(JSON.parse(localStorage.getItem('fambit_senal_v1')||'null')||{}).items||[];}catch(e){}
  const m={};[...SENAL_REM,...L].forEach(i=>{if(i&&i.id&&(!m[i.id]||(i.actualizado||'')>(m[i.id].actualizado||'')))m[i.id]=i;});
  return Object.values(m).sort((a,b)=>(b.tsPub||0)-(a.tsPub||0)||(b.creado||'').localeCompare(a.creado||''));
}
function senalRemoto(){return fetch(FB+'fambit_senal_v1').then(r=>r.ok?r.json():null).then(d=>{const s=d&&d.fields&&d.fields.data&&d.fields.data.stringValue;if(s){try{SENAL_REM=JSON.parse(s).items||[];}catch(e){}}}).catch(()=>{});}
function origenOpciones(sel){
  const L=senalItems();const f=ts=>{const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
  let h=`<option value="">— Ninguno / no sé</option>`;
  const pub=L.filter(i=>i.tsPub),ide=L.filter(i=>!i.tsPub);
  if(pub.length)h+=`<optgroup label="Publicados">${pub.map(i=>`<option value="${i.id}" ${sel===i.id?'selected':''}>${esc(i.num)} · ${esc(i.titulo)} (${f(i.tsPub)})</option>`).join('')}</optgroup>`;

  if(sel&&!L.some(i=>i.id===sel))h+=`<option value="${esc(sel)}" selected>Contenido vinculado</option>`;
  return h;
}

/* ================= MÉTRICAS ================= */
let MET={y:new Date().getFullYear(),m:new Date().getMonth()};
const enMes=(iso,y,m)=>{if(!iso)return false;const d=new Date(iso);return d.getFullYear()===y&&d.getMonth()===m;};
function anillo(pct,color){const r=40,c=2*Math.PI*r,o=c*(1-(pct||0)/100);
  return `<svg class="met-anillo" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="#1B2070" stroke-width="10"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${o.toFixed(1)}" transform="rotate(-90 48 48)"/><text x="48" y="54" text-anchor="middle" font-family="Comfortaa,sans-serif" font-weight="700" font-size="18" fill="#F5F4FF">${pct==null?'—':pct+'%'}</text></svg>`;}
function renderMetricas(){
  DB=cargar();const {y,m}=MET;const ps=DB.pedidos.filter(p=>p.estado!=='borrador');
  // dinero del mes (pedidos confirmados creados en el mes)
  const mes=ps.filter(p=>enMes(p.creado,y,m)),cs=mes.map(calcular);
  const vendido=cs.reduce((a,c)=>a+c.total,0),recaudado=cs.reduce((a,c)=>a+c.pagado,0),porCobrar=cs.reduce((a,c)=>a+c.saldo,0);
  const unidades=cs.reduce((a,c)=>a+c.unidades,0);
  // mes anterior para comparar
  const pm=new Date(y,m-1,1);const vendAnt=ps.filter(p=>enMes(p.creado,pm.getFullYear(),pm.getMonth())).reduce((a,p)=>a+calcular(p).total,0);
  const varTxt=vendAnt?`${vendido>=vendAnt?'▲':'▼'} ${Math.abs(Math.round((vendido-vendAnt)/vendAnt*100))}% vs ${MESES[pm.getMonth()].slice(0,3).toLowerCase()}`:'';
  // tendencia 6 meses
  const meses=[];for(let i=5;i>=0;i--){const d=new Date(y,m-i,1);const v=ps.filter(p=>enMes(p.creado,d.getFullYear(),d.getMonth())).reduce((a,p)=>a+calcular(p).total,0);meses.push({et:MESES[d.getMonth()].slice(0,3),v,act:i===0});}
  const max=Math.max(1,...meses.map(x=>x.v));const W=420,H=170,bw=46,gap=(W-bw*6)/7;
  const barras=meses.map((x,i)=>{const h=Math.round(x.v/max*110),bx=gap+i*(bw+gap),by=140-h;
    return `<rect x="${bx}" y="${by}" width="${bw}" height="${Math.max(h,2)}" rx="8" fill="${x.act?'#FFD42E':'#5852F2'}" opacity="${x.v?1:.35}"/>
      ${x.v?`<text x="${bx+bw/2}" y="${by-6}" text-anchor="middle" font-family="Comfortaa,sans-serif" font-weight="700" font-size="12" fill="${x.act?'#FFD42E':'#C4C6F5'}">${x.v>=1000000?(x.v/1e6).toFixed(1)+'M':Math.round(x.v/1000)+'k'}</text>`:''}
      <text x="${bx+bw/2}" y="160" text-anchor="middle" font-family="Sulphur Point,sans-serif" font-weight="700" font-size="13" fill="${x.act?'#FFD42E':'#8A8DC7'}">${x.et}</text>`;}).join('');
  // entregas a tiempo (despachados en el mes con fecha de entrega)
  const desp=DB.pedidos.filter(p=>p.estado==='entregado'&&p.tsEntregado&&enMes(new Date(p.tsEntregado).toISOString(),y,m));
  const conFecha=desp.filter(p=>p.entrega);const aTiempo=conFecha.filter(p=>ymd(new Date(p.tsEntregado))<=p.entrega).length;
  const pctT=conFecha.length?Math.round(aTiempo/conFecha.length*100):null;
  const reprog=camLoad().filter(c=>c.tipo==='fecha'&&enMes(new Date(c.ts).toISOString(),y,m)).length;
  // satisfacción del mes
  const sat=satLoad();const ev=Object.values(sat).filter(r=>r.cal&&enMes(new Date(r.ts).toISOString(),y,m));
  const pctS=ev.length?Math.round(ev.filter(r=>r.cal==='satisfecho').length/ev.length*100):null;
  const cnt=k=>ev.filter(r=>r.cal===k).length;
  $('metRoot').innerHTML=`<div class="cal-cab"><button class="cal-nav" data-met="-1" aria-label="Mes anterior">‹</button><h2>📊 ${MESES[m]} ${y}</h2><button class="cal-nav" data-met="1" aria-label="Mes siguiente">›</button></div>
    <div class="met-sec"><h3>💰 Dinero del mes</h3><div class="met-grid">
      <div class="met-k"><b>${mes.length}</b><span>Pedidos</span><small>${unidades} unidades</small></div>
      <div class="met-k"><b style="color:var(--amarillo)">${fmt(vendido)}</b><span>Vendido</span><small style="color:${vendido>=vendAnt?'var(--ok)':'var(--mal)'}">${varTxt}</small></div>
      <div class="met-k"><b style="color:var(--ok)">${fmt(recaudado)}</b><span>Recaudado</span><small>${vendido?Math.round(recaudado/vendido*100)+'% de lo vendido':''}</small></div>
      <div class="met-k"><b style="color:#FF9DB0">${fmt(porCobrar)}</b><span>Por cobrar</span><small>${mes.filter((p,i)=>cs[i].saldo>0).length} con saldo</small></div>
    </div><p class="nota">Cuenta los pedidos confirmados (no borradores) registrados en el mes.</p></div>
    <div class="met-sec"><h3>📈 Tendencia · últimos 6 meses</h3><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:230px;display:block;margin:0 auto" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ventas por mes">${barras}</svg></div>
    <div class="met-grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
      <div class="met-sec" style="margin:0"><h3>📦 Entregas a tiempo</h3>${conFecha.length?`<div class="met-big">${anillo(pctT,pctT>=85?'#2BD67B':pctT>=60?'#FFA800':'#FF5C7A')}<p><b>${aTiempo}</b> de <b>${conFecha.length}</b> despachados llegaron en su fecha.<br>📅 ${reprog} ${reprog===1?'reprogramación':'reprogramaciones'} este mes.</p></div>`:`<p class="met-vacio">Aún no hay pedidos despachados con fecha de entrega este mes.${reprog?`<br>📅 ${reprog} ${reprog===1?'reprogramación':'reprogramaciones'} este mes.`:''}</p>`}</div>
      <div class="met-sec" style="margin:0"><h3>⭐ Satisfacción</h3>${ev.length?`<div class="met-big">${anillo(pctS,pctS>=85?'#2BD67B':pctS>=60?'#FFA800':'#FF5C7A')}<p><b>${ev.length}</b> ${ev.length>1?'evaluaciones':'evaluación'} este mes.<br>😊 ${cnt('satisfecho')} · 😐 ${cnt('normal')} · 😞 ${cnt('insatisfecho')}</p></div>`:`<p class="met-vacio">Aún no hay evaluaciones este mes.</p>`}</div>
    </div>${carteraHTML()}`;
}
function carteraHTML(){
  const deudas=[];const porCli={};
  DB.pedidos.filter(p=>p.estado!=='borrador').forEach(p=>{const c=calcular(p);if(c.saldo<=0)return;
    const k=telK(p.tel)?'t'+telK(p.tel):'n'+norm(p.cliente);
    const d=porCli[k]=porCli[k]||{nombre:p.cliente,tel:p.tel,saldo:0,peds:[],antiguo:p.creado};
    d.saldo+=c.saldo;d.peds.push({id:p.id,num:p.num,saldo:c.saldo});if(p.tel)d.tel=p.tel;if(p.creado<d.antiguo)d.antiguo=p.creado;});
  Object.values(porCli).forEach(d=>deudas.push(d));deudas.sort((a,b)=>b.saldo-a.saldo);
  const total=deudas.reduce((a,d)=>a+d.saldo,0);

  return `<div class="met-sec" style="margin-top:14px"><h3>🧾 Cartera por cobrar</h3>
    <div class="met-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px">
      <div class="met-k"><b style="color:#FF9DB0">${fmt(total)}</b><span>Te deben en total</span><small>Todos los pedidos confirmados</small></div>
      <div class="met-k"><b>${deudas.length}</b><span>Persona${deudas.length===1?'':'s'} con saldo</span><small>${deudas.reduce((a,d)=>a+d.peds.length,0)} pedido(s)</small></div></div>
    ${deudas.length?deudas.map(d=>`<div class="deu"><span class="ac-av">${inic(d.nombre)}</span><div style="min-width:0;flex:1"><b>${esc(d.nombre)}</b><small>Hace ${dias(d.antiguo)} día${dias(d.antiguo)===1?'':'s'} · ${d.peds.length} pedido${d.peds.length>1?'s':''}</small>
      <div class="deu-peds">${d.peds.map(x=>`<button data-abrir="${x.id}">${esc(x.num)} · ${fmt(x.saldo)}</button>`).join('')}</div></div>
      <div class="mto"><b>${fmt(d.saldo)}</b>${d.tel?`<br><button class="btn-cobrar" data-cobrar="${esc(d.tel)}" data-nom="${esc(d.nombre)}" data-saldo="${d.saldo}" data-peds="${esc(d.peds.map(x=>x.num).join(', '))}">Cobrar</button>`:'<br><small>Sin WhatsApp</small>'}</div></div>`).join('')
      :`<p class="met-vacio">Nadie te debe. Todo está al día ✨</p>`}</div>`;
}

/* ================= CLIENTES ================= */
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const telK=t=>{const d=String(t||'').replace(/\D/g,'');return d.length>=7?d.slice(-10):'';};
const inic=n=>norm(n).split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
function clientes(){
  DB=cargar();const mapa={},porNombre={};
  const orden=[...DB.pedidos].sort((a,b)=>(a.creado||'').localeCompare(b.creado||''));
  const asignar=(p,k)=>{const c=mapa[k]=mapa[k]||{k,nombre:'',tel:'',correo:'',depto:'',ciudad:'',dir:'',pedidos:[]};
    c.pedidos.push(p);['tel','correo','depto','ciudad','dir'].forEach(f=>{if(p[f])c[f]=p[f];});c.nombre=p.cliente||c.nombre;porNombre[norm(p.cliente)]=k;};
  orden.filter(p=>telK(p.tel)).forEach(p=>asignar(p,'t'+telK(p.tel)));
  orden.filter(p=>!telK(p.tel)&&p.cliente).forEach(p=>asignar(p,porNombre[norm(p.cliente)]||'n'+norm(p.cliente)));
  return Object.values(mapa).map(c=>{
    const cs=c.pedidos.map(calcular);c.total=cs.reduce((a,x)=>a+x.total,0);c.saldo=c.pedidos.reduce((a,p,i)=>a+(p.estado!=='borrador'?cs[i].saldo:0),0);
    c.ultimo=c.pedidos.reduce((m,p)=>p.creado>m?p.creado:m,'');c.confirmados=c.pedidos.filter(p=>p.estado!=='borrador').length;
    const fav={};c.pedidos.forEach(p=>p.items.forEach(i=>{if(i.dis)fav[i.dis]=(fav[i.dis]||0)+num(i.cant);}));c.favs=Object.entries(fav).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return c;}).sort((a,b)=>b.ultimo.localeCompare(a.ultimo));
}
function coincide(c,q){if(!q)return false;const n=norm(c.nombre);return n.startsWith(q)||n.split(' ').some(w=>w.startsWith(q))||inic(c.nombre).toLowerCase().startsWith(q.replace(/\s/g,''))||(telK(q)&&c.tel&&telK(c.tel).includes(telK(q)));}
function resaltar(nombre,q){const i=norm(nombre).indexOf(q);return i<0?esc(nombre):esc(nombre.slice(0,i))+'<mark>'+esc(nombre.slice(i,i+q.length))+'</mark>'+esc(nombre.slice(i+q.length));}
let CLI_CACHE=null;
function acMostrar(cid,val){
  const q=norm(val),ac=zona(cid,'ac');if(q.length<1){ac.classList.remove('on');return;}
  CLI_CACHE=clientes();const res=CLI_CACHE.filter(c=>coincide(c,q)).slice(0,6);
  if(!res.length){ac.classList.remove('on');return;}
  ac.innerHTML=res.map((c,i)=>`<div class="ac-it ${i===0?'act':''}" data-cli="${esc(c.k)}"><span class="ac-av">${inic(c.nombre)}</span><div><b>${resaltar(c.nombre,q)}</b><small>${[c.tel,c.ciudad].filter(Boolean).map(esc).join(' · ')||'Sin datos de contacto'} · ${c.pedidos.length} pedido${c.pedidos.length>1?'s':''}</small></div></div>`).join('');
  ac.classList.add('on');
}
function acElegir(cid,k){
  const c=(CLI_CACHE||clientes()).find(x=>x.k===k);if(!c)return;const p=ED[cid].ped;
  p.cliente=c.nombre;['tel','correo','depto','ciudad','dir'].forEach(f=>p[f]=c[f]||'');ED[cid].cliK=k;

}

        <div class="d-info">${c.tel?`<div><small>WhatsApp</small><span>${esc(c.tel)}</span></div>`:''}${c.correo?`<div><small>Correo</small><span>${esc(c.correo)}</span></div>`:''}${c.dir?`<div style="grid-column:1/-1"><small>Dirección</small><span>${esc(c.dir)}</span></div>`:''}</div>

        <span class="lbl">Pedidos</span>${[...c.pedidos].sort((a,b)=>(b.creado||'').localeCompare(a.creado||'')).map(evFila).join('')}

  const ab=e.target.closest('[data-abrir]');if(ab){abrirCajon(ab.dataset.abrir);return;}

});

/* ================= SATISFACCIÓN ================= */
const SAT_H=72, SAT_KEY='fambit_mercante_sat', SAT_IMG='fambit_mercante_sat_img';
const SAT_CAL={satisfecho:{et:'Satisfecho',ic:'😊',c:'#2BD67B'},normal:{et:'Normal',ic:'😐',c:'#FFA800'},insatisfecho:{et:'Insatisfecho',ic:'😞',c:'#FF5C7A'}};
const SAT_CAT={queja:'😤 Queja',sugerencia:'💡 Sugerencia',elogio:'🙏 Elogio',duda:'❓ Duda',otro:'💬 Otro'};
const satLoad=()=>{try{return JSON.parse(localStorage.getItem(SAT_KEY)||'{}');}catch(e){return {};}};
const satImgs=()=>{try{return JSON.parse(localStorage.getItem(SAT_IMG)||'{}');}catch(e){return {};}};
const horasDesp=p=>p.tsEntregado?Math.floor((Date.now()-p.tsEntregado)/36e5):SAT_H;
const SATF={};   // formulario abierto por pedido: {cal,cat,img}
function satBadge(){DB=cargar();const sat=satLoad();const n=DB.pedidos.filter(p=>p.estado==='entregado'&&!(sat[p.id]||{}).cal&&horasDesp(p)>=SAT_H).length;$('tabSat').textContent=n||'';}
function renderSat(){
  DB=cargar();const sat=satLoad(),imgs=satImgs();
  const desp=DB.pedidos.filter(p=>p.estado==='entregado');
  const pend=desp.filter(p=>!(sat[p.id]||{}).cal).sort((a,b)=>(a.tsEntregado||0)-(b.tsEntregado||0));
  const eval_=desp.filter(p=>(sat[p.id]||{}).cal).sort((a,b)=>(sat[b.id].ts||0)-(sat[a.id].ts||0));
  const cuenta=k=>eval_.filter(p=>sat[p.id].cal===k).length;
  const pct=eval_.length?Math.round(cuenta('satisfecho')/eval_.length*100)+'%':'—';
  let h=`<div class="titulo"><h2>⭐ Satisfacción al cliente</h2><p>Los pedidos despachados se evalúan pasadas las ${SAT_H} horas.</p></div>
    <div class="sat-res"><div class="stat am"><b>${pct}</b><span>Satisfechos</span></div>
      ${Object.entries(SAT_CAL).map(([k,v])=>`<div class="stat"><b style="color:${v.c}">${v.ic} ${cuenta(k)}</b><span>${v.et}</span></div>`).join('')}</div>`;
  if(!desp.length)h+=`<div class="vacio"><p>Cuando marques pedidos como <b style="color:${EST.entregado.c}">Despachados</b>, aparecerán aquí para evaluarlos pasadas las ${SAT_H} horas.</p></div>`;
  else if(!pend.length)h+=`<div class="vacio"><p>Todo evaluado ✨</p></div>`;
  else h+=`<div class="grupo">Pendientes de evaluación · ${pend.length}</div>`+pend.map(satCard).join('');
  if(eval_.length)h+=`<div class="grupo">Evaluados · ${eval_.length}</div>`+eval_.map(p=>{const r=sat[p.id],v=SAT_CAL[r.cal];
    return `<div class="sat-ev" style="border-left-color:${v.c}"><span class="em">${v.ic}</span><div><b>${esc(p.cliente)}</b><small>${esc(p.num)} · ${v.et}${r.cat?' · '+SAT_CAT[r.cat]:''} · ${fechaCorta(new Date(r.ts).toISOString())}</small></div>${imgs[p.id]?`<img src="${imgs[p.id]}" alt="Evidencia" data-verimg="${p.id}">`:''}</div>`;}).join('');
  $('satRoot').innerHTML=h;satBadge();
}
function satCard(p){
  const hs=horasDesp(p),lista=hs>=SAT_H,f=SATF[p.id];
  const desp=p.tsEntregado?new Date(p.tsEntregado).toLocaleDateString('es-CO',{day:'numeric',month:'short'}):'sin fecha';
  let c=`<div class="sat-card ${lista?'lista':''}"><div class="sat-head"><div style="flex:1;min-width:0"><div class="sat-nom">${esc(p.cliente)}</div><div class="sat-sub">${esc(p.num)} · Despachado ${desp} · ${fmt(calcular(p).total)}</div></div>`;
  if(!lista)return c+`<div class="sat-esp"><small>Disponible en</small><b>${SAT_H-hs}h</b></div></div><div class="sat-bar"><i style="width:${Math.round(hs/SAT_H*100)}%"></i></div></div>`;
  c+=`<button class="btn ${f?'sec2':'am'}" style="width:auto;padding:9px 14px;font-size:13px" data-sat="toggle" data-id="${p.id}">${f?'✕ Cerrar':'⭐ Evaluar'}</button></div>`;
  if(f){
    c+=`<div class="sat-cal">${Object.entries(SAT_CAL).map(([k,v])=>`<button type="button" data-sat="cal" data-id="${p.id}" data-v="${k}" style="border-color:${f.cal===k?v.c:v.c+'44'};color:${v.c};background:${f.cal===k?v.c+'22':'transparent'}"><span>${v.ic}</span>${v.et}</button>`).join('')}</div>
      <select class="campo" data-sat="cat" data-id="${p.id}"><option value="">Categoría (opcional)</option>${Object.entries(SAT_CAT).map(([k,v])=>`<option value="${k}" ${f.cat===k?'selected':''}>${v}</option>`).join('')}</select>
      <label class="evid">${f.img?`<img src="${f.img}" alt="">`:'🖼️ Agregar captura de evidencia (opcional)'}<input type="file" accept="image/*" hidden data-sat="img" data-id="${p.id}"></label>
      <div class="err ${f.err?'on':''}">Elige una calificación antes de guardar</div>
      <div class="acciones"><button class="btn am" data-sat="guardar" data-id="${p.id}">Guardar evaluación</button></div>`;
  }
  return c+'</div>';
}
$('satRoot').addEventListener('click',e=>{
  const v=e.target.closest('[data-verimg]');if(v){window.open(satImgs()[v.dataset.verimg],'_blank');return;}
  const b=e.target.closest('[data-sat]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;const id=b.dataset.id,a=b.dataset.sat;
  if(a==='toggle'){if(SATF[id])delete SATF[id];else SATF[id]={cal:'',cat:'',img:''};renderSat();}
  else if(a==='cal'){SATF[id].cal=b.dataset.v;SATF[id].err=false;renderSat();}
  else if(a==='guardar'){const f=SATF[id];if(!f.cal){f.err=true;renderSat();return;}
    const sat=satLoad();sat[id]={cal:f.cal,cat:f.cat,ts:Date.now(),img:!!f.img};
    let aviso=false;if(f.img){const im=satImgs();im[id]=f.img;try{localStorage.setItem(SAT_IMG,JSON.stringify(im));}catch(er){aviso=true;sat[id].img=false;}}
    lsSet(SAT_KEY,JSON.stringify(sat));delete SATF[id];renderSat();toast(aviso?'Evaluación guardada, pero la foto no cupo en este dispositivo':'⭐ Evaluación guardada');}
});
$('satRoot').addEventListener('change',e=>{
  const el=e.target;if(!el.dataset.sat)return;const id=el.dataset.id;
  if(el.dataset.sat==='cat'){SATF[id].cat=el.value;return;}
  if(el.dataset.sat==='img'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);SATF[id].img=cv.toDataURL('image/jpeg',0.62);renderSat();};im.src=fr.result;};fr.readAsDataURL(el.files[0]);}
});
setInterval(()=>{satBadge();if($('vista-satisfaccion').classList.contains('on')&&!Object.keys(SATF).length)renderSat();},60000);

/* ================= MODAL FECHA DE ENTREGA ================= */
let FID=null;
function abrirFecha(id){DB=cargar();const p=DB.pedidos.find(x=>x.id===id);if(!p)return;FID=id;
  $('mFechaCuerpo').innerHTML=`<h3>📅 Fecha de entrega</h3><p class="sub">${esc(p.cliente)} · ${esc(p.num)}</p>
    <input class="campo" type="date" id="mFechaIn" value="${esc(p.entrega||'')}">
    <div class="acciones"><button class="btn am" id="mFechaOk">Guardar</button>${p.entrega?'<button class="btn sec2" id="mFechaQuitar">Quitar fecha</button>':''}<button class="btn sec2" id="mFechaNo">Cancelar</button></div>`;
  $('mFecha').classList.add('on');}
$('mFecha').addEventListener('click',e=>{
  const id=e.target.id;if(id==='mFecha'||id==='mFechaNo'){$('mFecha').classList.remove('on');return;}
  if(id==='mFechaOk'||id==='mFechaQuitar'){DB=cargar();const p=DB.pedidos.find(x=>x.id===FID);const ant=p.entrega||'',nue=id==='mFechaOk'?$('mFechaIn').value:'';
    const aplicar=()=>{DB=cargar();const q=DB.pedidos.find(x=>x.id===FID);q.entrega=nue;q.actualizado=new Date().toISOString();guardarDB();renderLista();if($('vista-calendario').classList.contains('on'))renderCal();toast(q.entrega?'Entrega: '+infoEntrega(q).txt:'Fecha quitada');};
    $('mFecha').classList.remove('on');
    if(ant&&ant!==nue)razonFecha(p,ant,nue,aplicar);else if(ant!==nue)aplicar();}
});

/* ================= MODAL DE PAGO ================= */
let PID=null,PSEL=null;
function abrirPago(id){DB=cargar();const p=DB.pedidos.find(x=>x.id===id);if(!p)return;PID=id;PSEL=p.estadoPago||'sin_pago';pintarPago();$('mPago').classList.add('on');}
function pintarPago(){
  const p=DB.pedidos.find(x=>x.id===PID);const c=calcular(p);
  $('mPagoCuerpo').innerHTML=`<h3>💳 Estado de pago</h3><p class="sub">${esc(p.cliente)} · A cobrar ${fmt(c.total)}</p>
    <div class="pills p3">${Object.entries(PAGO).map(([k,v])=>`<button type="button" class="pl" style="${PSEL===k?`background:${v.c};border-color:${v.c};color:#0A128A`:`border-color:${v.c}55;color:${v.c}`}" data-psel="${k}">${v.ic}<br>${v.et}</button>`).join('')}</div>
    ${PSEL==='abonado'?`<label class="lbl" style="margin-top:14px" for="mAbono">¿Cuánto abonó?</label><input class="campo" id="mAbono" inputmode="numeric" value="${p.estadoPago==='abonado'?num(p.abonado):''}" placeholder="$0"><p class="nota" id="mSaldo" style="text-align:right"></p><div class="err" id="mErr">Escribe un valor mayor a $0</div>`:''}
    <div class="acciones"><button class="btn am" id="mGuardar">Guardar</button><button class="btn sec2" id="mCancelar">Cancelar</button></div>`;
  const ab=$('mAbono');if(ab){const upd=()=>{$('mSaldo').textContent='Saldo: '+fmt(Math.max(0,c.total-num(ab.value)));$('mErr').classList.remove('on');};ab.oninput=upd;upd();}
}
$('mPago').addEventListener('click',e=>{
  if(e.target.id==='mPago'||e.target.id==='mCancelar'){$('mPago').classList.remove('on');return;}
  const s=e.target.closest('[data-psel]');if(s){PSEL=s.dataset.psel;pintarPago();return;}
  if(e.target.id==='mGuardar'){
    DB=cargar();const p=DB.pedidos.find(x=>x.id===PID);const c=calcular(p);
    if(PSEL==='abonado'){const v=num($('mAbono').value);if(v<=0){$('mErr').classList.add('on');return;}if(v>=c.total){PSEL='pagado';}else p.abonado=v;}
    p.pagos=p.pagos||[];const antes=calcular(p).pagado;p.estadoPago=PSEL;if(PSEL!=='abonado')p.abonado=PSEL==='pagado'?c.total:0;
    const dif=calcular(p).pagado-antes;if(dif)p.pagos.push({monto:dif,fecha:new Date().toISOString()});
    p.actualizado=new Date().toISOString();guardarDB();$('mPago').classList.remove('on');renderLista();toast('Pago actualizado · '+PAGO[p.estadoPago].et);}
});

/* ================= WHATSAPP ================= */
function telWa(t){let d=String(t||'').replace(/\D/g,'');if(d.length===10)d='57'+d;return d;}
function abrirWa(p){
  const c=calcular(p);const n=(p.cliente||'').split(' ')[0];const items=p.items.map(i=>`${i.cant}× ${i.nombre} (${i.prod})`).join(', ');
  const saldo=c.saldo>0?` Saldo pendiente: ${fmt(c.saldo)}.`:'';
  const m={
    borrador:`¡Hola ${n}! 👋 Te comparto la cotización ${cotNum(p)} de Fambit: ${items}. Total: ${fmt(c.total)}. Para confirmar tu pedido puedes hacer el pago o el abono acordado y empezamos a fabricarlo 🔑`,
    forja:`¡Hola ${n}! Tu pedido ${p.num} ya está en la Forja ⚒️ Estamos fabricando tus diseños. Te avisamos apenas esté listo.`,
    listo:`¡${n}, tu pedido ${p.num} está listo! ✨${saldo} ¿Cómo prefieres recibirlo?`,
    entregado:`¡Hola ${n}! Tu pedido ${p.num} ya fue despachado 📦 Esperamos que disfrutes tus diseños. Si te gustaron, etiquétanos en Instagram @fambit.co 💛`}[p.estado]||'';
  window.open(`https://wa.me/${telWa(p.tel)}?text=${encodeURIComponent(m)}`,'_blank');
}

/* ================= HOJAS (ajustes) ================= */
function abrir(id){$('velo').classList.add('on');$(id).classList.add('on');$(id).scrollTop=0;}
function cerrarTodo(){document.querySelectorAll('.hoja.on').forEach(h=>h.classList.remove('on'));if(!$('cajon').classList.contains('on'))$('velo').classList.remove('on');}
document.querySelectorAll('[data-cerrar]').forEach(b=>b.onclick=cerrarTodo);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('mRazon').classList.contains('on')){$('mRazon').classList.remove('on');RAZ=null;return;}$('mPago').classList.remove('on');$('mFecha').classList.remove('on');cerrarTodo();cerrarCajon();}});
function render(){renderLista();}
