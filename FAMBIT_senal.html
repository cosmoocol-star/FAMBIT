<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060930">
<title>Señal · Fambit Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Sulphur+Point:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A128A; --lila:#5852F2; --lila2:#8F8BFF; --azul:#2643E9; --naranja:#FFA800; --amarillo:#FFD42E;
  --bg:#060930; --card:#0F1350; --card2:#151A62; --line:rgba(196,198,245,.14); --tinta:#F5F4FF; --tinta2:#C4C6F5; --tinta3:#8A8DC7;
  --ok:#2BD67B; --mal:#FF5C7A;
  --titulo:'Comfortaa',system-ui,sans-serif; --texto:'Sulphur Point',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;color:var(--tinta);font-family:var(--texto);font-size:15px;
  background:radial-gradient(ellipse 80% 40% at 50% 0%, rgba(88,82,242,.22), transparent 70%),var(--bg);padding-bottom:110px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--titulo);font-weight:700}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}

/* encabezado */
.top{position:sticky;top:0;z-index:10;background:rgba(6,9,48,.97);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:12px;height:62px}
.volver{display:flex;align-items:center;gap:6px;color:var(--tinta2);text-decoration:none;font-size:13px;padding:8px 10px 8px 6px;border-radius:10px}
.volver:hover{background:rgba(255,255,255,.05)}
.top h1{font-size:18px;line-height:1}.top h1 span{color:var(--amarillo)}
.top p{font-size:12px;color:var(--tinta3);margin-top:3px}
.sp{flex:1}
.sync{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 10px;font-size:11px;font-family:var(--titulo);font-weight:700;color:var(--tinta3)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--tinta3)}
.sync.ok i{background:var(--ok)}.sync.run i{background:var(--amarillo);animation:pulso 1s infinite}.sync.err i{background:var(--mal)}.sync.off i{background:#888}
@keyframes pulso{50%{opacity:.3}}
@media(max-width:420px){.sync span{display:none}}
.tabs-wrap{padding-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;color:var(--tinta2);border-radius:12px;padding:9px 16px;font-family:var(--titulo);font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:var(--amarillo);border-color:var(--amarillo);color:var(--navy)}
.tab-n{margin-left:6px;background:var(--mal);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}
.vista{display:none}.vista.on{display:block}
.titulo{margin:18px 0 14px}.titulo h2{font-size:22px}.titulo p{color:var(--tinta3);font-size:14px;margin-top:4px}

/* formularios */
.sec{margin-bottom:16px}
.lbl{display:block;font-size:12px;color:var(--tinta3);letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase;font-weight:700}
.lbl small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--tinta3)}
.campo{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;min-width:0}
.campo:focus{border-color:var(--lila2)}
textarea.campo{resize:vertical;min-height:74px;line-height:1.4}
select.campo{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tinta2) 50%),linear-gradient(135deg,var(--tinta2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.fila{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fila3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:520px){.fila3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--tinta2);cursor:pointer;font-family:var(--titulo);font-weight:700}
.chip.on{background:var(--lila);border-color:var(--lila);color:#fff}
.chip i{font-style:normal;opacity:.75;margin-left:4px}
.btn{border:none;border-radius:14px;padding:14px 16px;font-family:var(--titulo);font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn.am{background:var(--amarillo);color:var(--navy)}
.btn.li{background:var(--lila);color:#fff}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--tinta2)}
.btn.rojo{background:transparent;border:1px solid rgba(255,92,122,.4);color:#FF9DB0;font-size:13px;padding:11px}
.caja{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--titulo);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;color:var(--tinta3);letter-spacing:.3px}
.stat.am b{color:var(--amarillo)}.stat.alerta{border-color:rgba(255,168,0,.5)}.stat.alerta b{color:var(--naranja)}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}.filtros::-webkit-scrollbar{display:none}

/* tarjetas de contenido */
.ct{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;transition:border-color .2s}
.ct:hover{border-color:rgba(143,139,255,.45)}
.ct.urge{border-color:rgba(255,168,0,.55)}
.ct-top{display:flex;align-items:center;gap:8px;min-width:0}
.ct-num{font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--tinta3);flex:none}
.ct-tit{font-family:var(--titulo);font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.gear{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--lila2);font-size:16px;cursor:pointer}
.ct-mid{font-size:13px;color:var(--tinta2);margin:8px 0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ct-bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-family:var(--titulo);font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.2px;white-space:nowrap}
.s-idea{background:rgba(143,139,255,.18);color:var(--lila2)}
.s-espera{background:rgba(38,67,233,.25);color:#9DB0FF}
.s-medir{background:rgba(255,168,0,.18);color:var(--naranja)}
.s-medido{background:rgba(255,212,46,.16);color:var(--amarillo)}
.s-ventas{background:rgba(43,214,123,.14);color:var(--ok)}
.p-obj{background:rgba(255,255,255,.06);color:var(--tinta2)}
.redes{font-size:13px;letter-spacing:2px}
.kpis{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--tinta2);font-weight:700}
.kpis b{font-family:var(--titulo);color:var(--tinta)}
.kpis .ok{color:var(--ok)}.kpis .mal{color:#FF9DB0}.kpis .am{color:var(--amarillo)}
.vacio{text-align:center;padding:48px 20px;color:var(--tinta3)}
.vacio .vic{font-size:34px;width:64px;height:64px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;background:rgba(88,82,242,.15);border:1.5px solid rgba(143,139,255,.3)}
.vacio h3{color:var(--tinta);font-size:17px;margin:12px 0 6px}

/* ficha (hoja inferior) */
.velo{position:fixed;inset:0;background:rgba(3,5,30,.72);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:50%;bottom:0;width:min(760px,100%);max-height:94vh;max-height:94dvh;overflow-y:auto;background:#0B0F45;border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;z-index:31;transform:translate(-50%,104%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility .32s}
.hoja.on{transform:translate(-50%,0);visibility:visible}
.h-cab{position:sticky;top:0;background:#0B0F45;z-index:2;padding:12px 18px;border-bottom:1px solid var(--line)}
.h-cab .r1{display:flex;align-items:center;gap:10px}
.h-cab h2{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cerrar{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--tinta2);font-size:15px;cursor:pointer;flex:none}
.pasos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.paso{border:1px solid var(--line);background:transparent;border-radius:12px;padding:8px 6px;font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--tinta3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.paso em{font-style:normal;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.paso.on{border-color:var(--amarillo);color:var(--amarillo);background:rgba(255,212,46,.06)}
.paso.hecho em{background:var(--ok);border-color:var(--ok);color:#06301A}
.paso.lock{opacity:.45}
.paso span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paso i{font-style:normal}.paso .co{display:none}
@media(max-width:480px){.paso .lg{display:none}.paso .co{display:inline}}
.h-cuerpo{padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
.reloj{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(38,67,233,.25),rgba(88,82,242,.12));border:1px solid rgba(143,139,255,.35);border-radius:16px;padding:14px;margin-bottom:16px}
.reloj .big{font-family:var(--titulo);font-weight:700;font-size:26px;color:var(--amarillo);flex:none}
.reloj p{font-size:13px;color:var(--tinta2);line-height:1.4}
.reloj .barra{height:6px;border-radius:3px;background:#1B2063;overflow:hidden;margin-top:8px}.reloj .barra i{display:block;height:100%;background:var(--amarillo)}
.comp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:14px;font-size:13px;color:var(--tinta2)}
.comp div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);line-height:1.4}
.comp div:last-child{border-bottom:none}
.comp span{color:var(--tinta3);font-size:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding-top:1px}
.comp b{color:var(--tinta);font-weight:700}
.ver{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ver button{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 4px;font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--tinta2);cursor:pointer}
.ver button.on[data-v="supero"]{background:rgba(43,214,123,.16);border-color:var(--ok);color:var(--ok)}
.ver button.on[data-v="cumplio"]{background:rgba(255,212,46,.14);border-color:var(--amarillo);color:var(--amarillo)}
.ver button.on[data-v="debajo"]{background:rgba(255,92,122,.14);border-color:var(--mal);color:#FF9DB0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.switch b{font-family:var(--titulo);font-size:14px}
.switch small{display:block;font-size:12px;color:var(--tinta3);margin-top:2px}
.sw{width:46px;height:26px;border-radius:13px;background:#1B2063;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#C4C6F5;transition:transform .2s}
.switch.on .sw{background:var(--lila)}.switch.on .sw::after{transform:translateX(20px);background:#fff}
.embudo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.embudo div{background:var(--card2);border-radius:12px;padding:10px;text-align:center;min-width:0}
.embudo b{display:block;font-family:var(--titulo);font-size:18px}
.embudo span{font-size:11px;color:var(--tinta3)}
.razon{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.razon:last-child{border-bottom:none}
.cnt{display:flex;align-items:center;gap:4px}
.cnt button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:16px;font-weight:700}
.cnt b{min-width:26px;text-align:center;font-family:var(--titulo)}
.nota-r{font-size:12px;margin-top:8px;color:var(--tinta3)}
.nota-r.mal{color:var(--naranja)}.nota-r.ok{color:var(--ok)}
.toast{white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;top:16px;transform:translate(-50%,-90px);background:#fff;color:#14174A;font-family:var(--titulo);font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;transition:transform .3s}
.toast.on{transform:translate(-50%,0)}
.acciones{display:flex;gap:10px;margin-top:6px}
.acciones .btn{flex:1}
.chip.reco{border-color:rgba(255,212,46,.6);color:var(--amarillo)}
.chip.reco::after{content:" ★";font-size:11px}
.chip.on.reco{color:#fff}
.guia{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;margin:-4px 0 16px;font-size:13px;line-height:1.4;color:var(--tinta2);background:rgba(88,82,242,.1);border:1px solid rgba(143,139,255,.3)}
.guia.choca{background:rgba(255,168,0,.08);border-color:rgba(255,168,0,.4)}
.guia.ok{background:rgba(43,214,123,.07);border-color:rgba(43,214,123,.35)}
.guia b{color:var(--tinta)}
.guia .tag{display:inline-block;font-family:var(--titulo);font-weight:700;font-size:10px;letter-spacing:.4px;padding:2px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}
.tag.v{background:rgba(43,214,123,.15);color:var(--ok)}.tag.pv{background:rgba(255,255,255,.08);color:var(--tinta3)}
.cal-cab{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.cal-cab h2{font-size:20px;flex:1}
.nav{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--tinta2);font-size:16px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dn{font-family:var(--titulo);font-weight:700;font-size:11px;color:var(--tinta3);text-align:center;padding:4px 0}
.dia{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:3px;transition:border-color .15s}
.dia:hover{border-color:rgba(143,139,255,.45)}
.dia.fuera{opacity:.35}.dia.hoy{border-color:var(--amarillo)}.dia.sel{background:var(--card2);border-color:var(--lila2)}
.dia .n{font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--tinta2)}
.dia.hoy .n{color:var(--amarillo)}
.ev{font-size:11px;font-weight:700;border-radius:7px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.ev.s-idea{background:transparent;border:1px dashed rgba(143,139,255,.6)}
.mas-ev{font-size:10px;color:var(--tinta3);font-weight:700}
@media(max-width:600px){.dia{min-height:58px;padding:4px}.ev{font-size:0;padding:0;width:16px;height:16px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}.ev::before{content:attr(data-ic);font-size:10px}.dia .evs{display:flex;flex-wrap:wrap;gap:2px}.mas-ev{display:none}}
.leyenda{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dia-det{margin-top:14px}
.dia-det h3{font-size:16px;margin-bottom:10px}
.fila-c{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.fila-c b{font-family:var(--titulo);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.rk.top1{border-color:rgba(255,212,46,.55)}
.rk .pos{font-family:var(--titulo);font-weight:700;font-size:18px;text-align:center;color:var(--tinta3)}
.rk .tt{font-family:var(--titulo);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.rk .sub{font-size:12px;color:var(--tinta3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.rk .met{font-family:var(--titulo);font-weight:700;color:var(--amarillo)}
.rep{border:none;border-radius:12px;padding:10px 12px;background:var(--lila);color:#fff;font-family:var(--titulo);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tabla{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.tabla th{font-family:var(--titulo);font-size:11px;color:var(--tinta3);text-align:right;padding:8px 6px;font-weight:700;letter-spacing:.3px}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tabla td.mejor{color:var(--amarillo);font-weight:700}
.tabla-w{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 10px;overflow-x:auto;margin-bottom:16px}
.h3s{font-family:var(--titulo);font-size:13px;letter-spacing:1px;color:var(--lila2);margin:20px 2px 10px;text-transform:uppercase}
.vinc{background:rgba(38,67,233,.12);border:1px solid rgba(143,139,255,.35);border-radius:14px;padding:12px;margin-bottom:14px}
.vinc h4{font-family:var(--titulo);font-size:13px;margin-bottom:8px}
.vinc .pd{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.vinc .pd:last-of-type{border-bottom:none}
.vinc .btn{margin-top:10px;padding:10px;font-size:13px}
.ia-cta{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(88,82,242,.28),rgba(38,67,233,.14));border:1px solid rgba(143,139,255,.4);border-radius:16px;padding:12px 14px;margin-bottom:18px}
.ia-cta div{flex:1;min-width:0}.ia-cta b{display:block;font-family:var(--titulo);font-size:14px}.ia-cta span{font-size:12px;color:var(--tinta2)}
.ia-cta .btn{width:auto;padding:11px 16px;font-size:14px;flex:none}
.idea-ia{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.idea-ia .cab{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.idea-ia .cab input{margin-top:3px;width:18px;height:18px;accent-color:#5852F2;flex:none}
.idea-ia .cab b{font-family:var(--titulo);font-size:14px;display:block;line-height:1.3}
.idea-ia .cab small{display:block;font-size:12px;color:var(--tinta3);margin-top:3px}
.idea-ia dl{margin:10px 0 0 28px;font-size:13px;line-height:1.45;color:var(--tinta2)}
.idea-ia dt{font-family:var(--titulo);font-weight:700;font-size:11px;letter-spacing:.4px;color:var(--lila2);text-transform:uppercase;margin-top:8px}
.idea-ia dd{margin:2px 0 0}
.cargando{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 10px;color:var(--tinta2);font-size:13px;text-align:center}
.cargando i{width:38px;height:38px;border-radius:50%;border:3px solid rgba(143,139,255,.25);border-top-color:var(--amarillo);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.estado-k{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:10px 12px;border-radius:12px;margin-bottom:14px}
.estado-k.ok{background:rgba(43,214,123,.1);color:var(--ok)}.estado-k.no{background:rgba(255,255,255,.05);color:var(--tinta3)}
.conectar{background:linear-gradient(135deg,rgba(255,212,46,.12),rgba(88,82,242,.14));border:1px solid rgba(255,212,46,.45);border-radius:16px;padding:14px;margin-bottom:18px}
.conectar b{display:block;font-family:var(--titulo);font-size:15px}.conectar>span{display:block;font-size:12px;color:var(--tinta2);margin:4px 0 10px}
.fila-k{display:flex;gap:8px}.fila-k .btn{width:auto;flex:none;padding:11px 16px;font-size:14px}
.metas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.meta{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;font-family:var(--titulo);font-weight:700;font-size:13px;color:var(--tinta2);cursor:pointer;line-height:1.3}
.meta.on{border-color:var(--amarillo);color:var(--amarillo);background:rgba(255,212,46,.07)}
@media(max-width:420px){.metas{grid-template-columns:1fr}}
.cuentas{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 2px;margin-bottom:18px}
.cuentas .ct-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.cuentas .ct-h b{font-family:var(--titulo);font-size:14px}.cuentas .ct-h span{font-size:11px;color:var(--tinta3)}
.cuentas .campo{margin-bottom:4px}.cuentas .nota-r{margin:0 0 10px}
.ideas-grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:900px){.ideas-grid{grid-template-columns:minmax(0,380px) minmax(0,1fr)}.ideas-conf{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 140px);overflow-y:auto;padding-right:4px}}
.ideas-res .h3s{margin-top:4px}
.lote,#iaRes{scroll-margin-top:130px}
.lote{background:rgba(15,19,80,.5);border:1px solid var(--line);border-radius:16px;padding:4px 12px 12px;margin-bottom:12px}
.lote summary{cursor:pointer;list-style:none;padding:10px 0;display:flex;flex-direction:column;gap:2px}
.lote summary::-webkit-details-marker{display:none}
.lote summary b{font-family:var(--titulo);font-size:14px}.lote summary span{font-size:12px;color:var(--tinta3)}
.lote[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.idea-ia.ya{opacity:.6}
.ok-tag{font-style:normal;font-size:11px;color:var(--ok);margin-left:4px}
.metas{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))!important}
.cuentas.foco{border-color:var(--amarillo);box-shadow:0 0 0 4px rgba(255,212,46,.18);transition:box-shadow .3s}
.seg-av{border-color:rgba(255,168,0,.55)}.seg-av a{color:var(--amarillo);font-weight:700}
.insight{display:flex;gap:10px;align-items:flex-start;background:rgba(255,212,46,.07);border:1px dashed rgba(255,212,46,.35);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--tinta2);line-height:1.4}
.insight b{color:var(--amarillo)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="volver" href="index.html" aria-label="Volver al cuarto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Cuarto</a>
    <div><h1>Señal <span>·</span></h1><p>Contenido, pauta y ventas</p></div>
    <div class="sp"></div>
    <span class="sync" id="syncDot"><i></i><span id="syncTxt">Local</span></span>
    <button class="gear" id="btnAjustes" aria-label="Ajustes de Claude" title="Ajustes de Claude" style="width:40px;height:40px;border-radius:12px">⚙</button>
  </div>
  <div class="wrap tabs-wrap"><nav class="tabs" id="tabs">
    <button class="tab" data-tab="nuevo">+ Nuevo</button>
    <button class="tab on" data-tab="lista">Contenidos<span class="tab-n" id="tabN" hidden></span></button>
    <button class="tab" data-tab="ideas">✨ Ideas</button>
    <button class="tab" data-tab="calendario">📅 Calendario</button>
    <button class="tab" data-tab="funcionan">🔥 Lo que funciona</button>
  </nav></div>
</header>

<main class="wrap">
  <section class="vista" id="vista-nuevo">
    <div class="titulo"><h2>Nuevo contenido</h2><p>La idea del video, qué esperas y para qué lo haces.</p></div>
    <div class="ia-cta"><div><b>✨ ¿Sin ideas?</b><span>Claude te propone ideas basadas en lo que te ha funcionado.</span></div><button class="btn li" type="button" data-ia="1">Pedir ideas</button></div>
    <div id="fNuevo"></div>
  </section>
  <section class="vista on" id="vista-lista"><div id="lista"></div></section>
  <section class="vista" id="vista-ideas"><div id="ideasRoot"></div></section>
  <section class="vista" id="vista-calendario"><div id="cal"></div></section>
  <section class="vista" id="vista-funcionan"><div id="fun"></div></section>
</main>

<div class="velo" id="velo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true"></div>
<div class="hoja" id="hojaIA" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== datos ===================== */
const SKEY='fambit_senal_v1';
const REDES=[['ig','Instagram','📸'],['tt','TikTok','🎵']];
const OBJETIVOS=['Ventas','Seguidores','Confianza en la marca','Comunidad','Cierre de ventas'];
/* guía de formatos: lo validado por experiencia propia + sugerencias por validar */
const GUIA={
  'Reel':       {ic:'🎬',obj:['Ventas','Seguidores'],val:true, t:'Trae gente nueva: seguidores y ventas, si el producto se ve claro y hay llamada a la acción.'},
  'Video largo':{ic:'🎞',obj:['Confianza en la marca'],val:true, t:'Genera confianza en la marca. No es para ventas ni seguidores.'},
  'Afiche':     {ic:'🖼',obj:['Ventas'],val:true, t:'Afiche publicitario: la oferta se entiende en un segundo. Rinde más con pauta y con quien ya te sigue.'},
  'Carrusel':   {ic:'🗂',obj:['Comunidad'],val:true, t:'Genera confianza en la comunidad: guardados y conversación.'},
  'Historia':   {ic:'⏱',obj:['Cierre de ventas'],val:false,t:'Cierra ventas con quien ya te sigue: encuestas, "quedan 3", reenviar pedidos entregados.'},
  'En vivo':    {ic:'🔴',obj:['Confianza en la marca','Ventas'],val:false,t:'Confianza y picos de venta; necesita una audiencia mínima.'}
};
const FORMATOS=Object.keys(GUIA);
const RAZONES=[['precio','Precio'],['envio','Envío / costo de envío'],['preguntaba','Solo estaba preguntando'],['norespondio','Dejó de responder'],['diseno','No había el diseño que quería'],['tiempo','Tiempo de entrega'],['pago','Medio de pago'],['otro','Otro']];
const H48=48*3600e3;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowISO=()=>new Date().toISOString();
const n0=v=>Math.max(0,parseInt(String(v).replace(/[^\d]/g,''),10)||0);
const fmt=n=>(+n||0).toLocaleString('es-CO');
const cop=n=>'$'+fmt(Math.round(+n||0));
const kfmt=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e4?Math.round(n/1e3)+'k':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'k':String(n);
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fLarga=ts=>{if(!ts)return '';const d=new Date(ts);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});};
const fCorta=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'';
const pct=(a,b)=>b>0?Math.round(a/b*100):0;

function cargar(){try{const d=JSON.parse(localStorage.getItem(SKEY)||'null');if(d&&Array.isArray(d.items))return d;}catch(e){}return {items:[],del:[]};}
let DB=cargar();
function guardar(){try{lsSet(SKEY,JSON.stringify(DB));}catch(e){toast('No se pudo guardar en este navegador');}pintar();if($('#vista-calendario').classList.contains('on'))pintarCal();if($('#vista-funcionan').classList.contains('on'))pintarFun();}
function tocar(it){it.actualizado=nowISO();}
function sigNum(){return DB.items.reduce((m,i)=>Math.max(m,parseInt((i.num||'').split('-')[1],10)||0),0)+1;}
function nuevoItem(d){return {id:uid(),num:'SE-'+String(sigNum()).padStart(3,'0'),titulo:'',idea:'',objetivo:'',expectativa:'',metaVistas:0,redes:[],formato:'',fechaPlan:'',link:'',
  tsPub:0,r48:null,pauta:{si:false,inversion:0,dias:0},ventas:{atraidos:0,cerrados:0,valor:0,razones:{},nota:'',ts:0},creado:nowISO(),actualizado:nowISO(),...d};}

/* etapa del contenido */
function etapa(it){
  if(!it.tsPub)return {k:'idea',t:'💡 Idea',c:'s-idea'};
  if(!it.r48){const falta=it.tsPub+H48-Date.now();
    return falta>0?{k:'espera',t:'⏳ Medir en '+horas(falta),c:'s-espera',falta}:{k:'medir',t:'📏 Medir 48 h',c:'s-medir'};}
  if(!it.ventas.ts)return {k:'medido',t:'📊 Medido',c:'s-medido'};
  return {k:'ventas',t:'💰 Con ventas',c:'s-ventas'};
}
function horas(ms){const h=Math.ceil(ms/3600e3);return h>=1?h+' h':'<1 h';}

/* ===================== pedidos de Mercante vinculados (solo lectura) ===================== */
const MERK='fambit_mercante_v2';let MER_REM={pedidos:[],del:[]};
function pedidosMer(){let L={};try{L=JSON.parse(localStorage.getItem(MERK)||'null')||{};}catch(e){}
  const del=new Set([...(L.del||[]),...(MER_REM.del||[])].map(d=>d&&d.id).filter(Boolean));
  const m={};[...(MER_REM.pedidos||[]),...(L.pedidos||[])].forEach(p=>{if(p&&p.id&&(!m[p.id]||(p.actualizado||'')>(m[p.id].actualizado||'')))m[p.id]=p;});
  return Object.values(m).filter(p=>!del.has(p.id));}
function merRemoto(){return fetch(FB+MERK).then(r=>r.ok?r.json():null).then(d=>{const s=d&&d.fields&&d.fields.data&&d.fields.data.stringValue;if(s){try{const j=JSON.parse(s);MER_REM={pedidos:j.pedidos||[],del:j.del||[]};}catch(e){}}}).catch(()=>{});}
const vinculados=id=>pedidosMer().filter(p=>p.origen===id);
const cerrado=p=>p.estado&&p.estado!=='borrador'&&p.estado!=='cancelado';

/* ===================== pestañas ===================== */
function irTab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));document.querySelectorAll('.vista').forEach(v=>v.classList.toggle('on',v.id==='vista-'+t));
  if(t==='nuevo'&&!arguments[1])montarNuevo();if(t==='calendario')pintarCal();if(t==='ideas')pintarIdeasVista();if(t==='funcionan')pintarFun();window.scrollTo(0,0);}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)irTab(b.dataset.tab);});

/* ===================== formulario de la idea (paso 1) ===================== */
function htmlIdea(it,pre){
  return `<div class="sec"><label class="lbl">Título del contenido</label><input class="campo" id="${pre}tit" maxlength="90" placeholder="Ej: Reel unboxing llaveros Demon Slayer" value="${esc(it.titulo)}"></div>
  <div class="sec"><label class="lbl">Idea del video</label><textarea class="campo" id="${pre}idea" rows="3" placeholder="De qué trata, cómo empieza (gancho), qué se muestra, cierre…">${esc(it.idea)}</textarea></div>
  <div class="sec"><label class="lbl">¿Para qué es?</label><div class="chips" data-grupo="objetivo">${OBJETIVOS.map(o=>`<button type="button" class="chip ${it.objetivo===o?'on':''}" data-v="${esc(o)}">${o}</button>`).join('')}</div></div>
  <div class="sec" style="margin-bottom:10px"><label class="lbl">Formato <small>(★ recomendado para ese objetivo)</small></label><div class="chips" data-grupo="formato">${FORMATOS.map(f=>`<button type="button" class="chip ${it.formato===f?'on':''}" data-v="${f}">${GUIA[f].ic} ${f}</button>`).join('')}</div></div>
  <div class="guia" data-guia></div>
  <div class="sec"><label class="lbl">Expectativa</label><textarea class="campo" id="${pre}exp" rows="2" placeholder="Qué esperas que pase: ej. que lleguen mensajes preguntando por la colección">${esc(it.expectativa)}</textarea></div>
  <div class="fila">
    <div class="sec"><label class="lbl">Meta de vistas <small>(opcional)</small></label><input class="campo" id="${pre}meta" inputmode="numeric" placeholder="Ej: 3.000" value="${it.metaVistas?fmt(it.metaVistas):''}"></div>
    <div class="sec"><label class="lbl">Fecha planeada</label><input class="campo" id="${pre}fecha" type="date" value="${it.fechaPlan||''}"></div>
  </div>
  <div class="sec"><label class="lbl">Redes</label><div class="chips" data-grupo="redes" data-multi="1">${REDES.map(([k,n,ic])=>`<button type="button" class="chip ${it.redes.includes(k)?'on':''}" data-v="${k}">${ic} ${n}</button>`).join('')}</div></div>
`;
}
function guia(root){
  const gEl=root.querySelector('[data-guia]');if(!gEl)return;
  const obj=leerChips(root,'objetivo'),fmt=leerChips(root,'formato');
  root.querySelectorAll('[data-grupo="formato"] .chip').forEach(b=>b.classList.toggle('reco',!!obj&&GUIA[b.dataset.v].obj.includes(obj)));
  const tag=f=>GUIA[f].val?'<span class="tag v">✓ VALIDADO</span>':'<span class="tag pv">POR VALIDAR</span>';
  gEl.className='guia';
  if(fmt&&GUIA[fmt]){const G=GUIA[fmt];
    if(obj&&!G.obj.includes(obj)){const mejor=FORMATOS.filter(f=>GUIA[f].obj.includes(obj));gEl.classList.add('choca');
      gEl.innerHTML=`⚠️<div><b>${fmt}</b> sirve más para <b>${G.obj.join(' y ')}</b>${tag(fmt)}.${mejor.length?` Para <b>${obj}</b> funciona mejor: <b>${mejor.join(', ')}</b>.`:''}</div>`;}
    else{if(obj)gEl.classList.add('ok');gEl.innerHTML=`${G.ic}<div><b>${fmt}:</b> ${G.t}${tag(fmt)}</div>`;}}
  else if(obj){const mejor=FORMATOS.filter(f=>GUIA[f].obj.includes(obj));
    gEl.innerHTML=`💡<div>Para <b>${obj}</b> te funciona: ${mejor.map(f=>`<b>${GUIA[f].ic} ${f}</b> ${tag(f)}`).join(' · ')||'—'}</div>`;}
  else gEl.innerHTML=`💡<div>Elige <b>para qué es</b> el contenido y te marco con ★ los formatos que mejor te funcionan.</div>`;
}
function leerChips(root,g){const el=root.querySelector(`[data-grupo="${g}"]`);const on=[...el.querySelectorAll('.chip.on')].map(b=>b.dataset.v);return el.dataset.multi?on:(on[0]||'');}
function leerIdea(root,pre){return {titulo:root.querySelector('#'+pre+'tit').value.trim(),idea:root.querySelector('#'+pre+'idea').value.trim(),expectativa:root.querySelector('#'+pre+'exp').value.trim(),
  metaVistas:n0(root.querySelector('#'+pre+'meta').value),fechaPlan:root.querySelector('#'+pre+'fecha').value,objetivo:leerChips(root,'objetivo'),redes:leerChips(root,'redes'),formato:leerChips(root,'formato')};}
document.addEventListener('click',e=>{const c=e.target.closest('[data-grupo] .chip');if(!c)return;const g=c.parentElement;
  if(g.dataset.multi)c.classList.toggle('on');else{const was=c.classList.contains('on');g.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));if(!was)c.classList.add('on');}
  if(g.dataset.grupo==='objetivo'||g.dataset.grupo==='formato')guia(g.closest('#fNuevo,#hoja'));});
document.addEventListener('input',e=>{if(e.target.matches('[inputmode="numeric"].campo')){const v=n0(e.target.value);e.target.value=v?fmt(v):'';}});

function montarNuevo(pre){
  const base=nuevoItem(pre||{});const r=$('#fNuevo');r.innerHTML=(pre&&pre.base?`<div class="insight">🔁<div>Repitiendo <b>${esc(pre.baseNum)}</b>. La meta de vistas parte de lo que logró; ajusta lo que quieras cambiar.</div></div>`:'')+htmlIdea(base,'n_')+`<button class="btn am" id="nGuardar">💡 Guardar idea</button>`;guia(r);
  $('#nGuardar').onclick=()=>{const d=leerIdea(r,'n_');if(!d.titulo){r.querySelector('#n_tit').focus();toast('Ponle un título al contenido');return;}
    DB.items.push(nuevoItem({...d,base:(pre&&pre.base)||''}));guardar();toast('Contenido guardado');irTab('lista');};
}

/* ===================== lista ===================== */
let FILTRO='todos';
const FILTROS=[['todos','Todos'],['idea','💡 Ideas'],['espera','⏳ En 48 h'],['medir','📏 Por medir'],['medido','📊 Medidos'],['ventas','💰 Con ventas']];
function pintar(){
  const L=DB.items.slice().sort((a,b)=>(b.creado||'').localeCompare(a.creado||''));
  const E=L.map(it=>[it,etapa(it)]);
  const cuenta=k=>E.filter(([,e])=>e.k===k).length;
  const nMedir=cuenta('medir');
  const tn=$('#tabN');tn.hidden=!nMedir;tn.textContent=nMedir;
  const atra=L.reduce((a,i)=>a+(+i.ventas.atraidos||0),0),cerr=L.reduce((a,i)=>a+(+i.ventas.cerrados||0),0);
  const inv=L.reduce((a,i)=>a+(i.pauta.si?+i.pauta.inversion||0:0),0),valor=L.reduce((a,i)=>a+(+i.ventas.valor||0),0),valorP=L.reduce((a,i)=>a+(i.pauta.si?+i.ventas.valor||0:0),0);
  const raz={};L.forEach(i=>Object.entries(i.ventas.razones||{}).forEach(([k,v])=>raz[k]=(raz[k]||0)+(+v||0)));
  const top=Object.entries(raz).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0];
  let h=`<div class="stats">
    <div class="stat"><b>${L.length}</b><span>Contenidos · ${L.filter(i=>i.tsPub).length} publicados${(()=>{const a=segActual('ig'),b=segActual('tt');return a||b?'<br>'+[a&&'📸 '+kfmt(a.n),b&&'🎵 '+kfmt(b.n)].filter(Boolean).join(' · '):'';})()}</span></div>
    <div class="stat ${nMedir?'alerta':''}"><b>${nMedir}</b><span>Por medir (48 h)</span></div>
    <div class="stat"><b>${fmt(atra)} → ${fmt(cerr)}</b><span>Clientes → ventas · ${pct(cerr,atra)}%</span></div>
    <div class="stat am"><b>${cop(valor)}</b><span>Generado${inv?` · pauta ${cop(inv)} (${(valorP/inv).toFixed(1)}x)`:''}</span></div>
  </div>`;
  {const a=[segActual('ig'),segActual('tt')].filter(Boolean),ult=a.length?Math.max(...a.map(x=>x.ts)):0;
   if(!ult||Date.now()-ult>7*864e5)h+=`<div class="insight seg-av">👥<div>${ult?`Hace ${Math.floor((Date.now()-ult)/864e5)} días no actualizas tus seguidores.`:'Aún no has anotado tus seguidores de Instagram y TikTok.'} <a href="#cuentas" data-ir-cuentas="1">Actualizar ahora</a></div></div>`;}
  if(top)h+=`<div class="insight">🔎<div>La razón más común de no cerrar venta es <b>${(RAZONES.find(r=>r[0]===top[0])||[,top[0]])[1]}</b> (${top[1]} ${top[1]===1?'cliente':'clientes'}).</div></div>`;
  h+=`<div class="filtros">${FILTROS.map(([k,n])=>{const c=k==='todos'?L.length:cuenta(k);return `<button class="chip ${FILTRO===k?'on':''}" data-f="${k}">${n}<i>${c}</i></button>`;}).join('')}</div>`;
  const V=E.filter(([,e])=>FILTRO==='todos'||e.k===FILTRO);
  if(!L.length)h+=`<div class="vacio"><div class="vic">📡</div><h3>Aún no hay contenidos</h3><p>Empieza con la idea de tu próximo video: qué esperas y para qué lo haces.</p><br><button class="btn am" style="width:auto;padding:12px 18px" onclick="irTab('nuevo')">+ Nuevo contenido</button></div>`;
  else if(!V.length)h+=`<div class="vacio">Nada en este filtro.</div>`;
  else h+=V.map(([it,e])=>tarjeta(it,e)).join('');
  $('#lista').innerHTML=h;
}
function tarjeta(it,e){
  const redes=it.redes.map(k=>(REDES.find(r=>r[0]===k)||[])[2]||'').join('');
  let h=`<div class="ct ${e.k==='medir'?'urge':''}" data-id="${it.id}">
    <div class="ct-top"><span class="ct-num">${it.num}</span><span class="ct-tit" data-abrir="1">${esc(it.titulo)}</span><button class="gear" data-abrir="1" aria-label="Abrir ficha">⚙</button></div>
    ${it.idea||it.expectativa?`<div class="ct-mid" data-abrir="1">${esc(it.idea||it.expectativa)}</div>`:''}

function calc3(){
  const atr=n0($('#v_atr').value),cer=n0($('#v_cer').value),val=n0($('#v_val').value),inv=$('#p_sw').classList.contains('on')?n0($('#p_inv').value):0;

  $('#v_emb').innerHTML=inv?`<div><b style="color:${val>=inv?'var(--ok)':'#FF9DB0'}">${val?(val/inv).toFixed(1)+'x':'—'}</b><span>Retorno de la pauta</span></div><div><b style="color:${gan>=0?'var(--ok)':'#FF9DB0'}">${gan>=0?'+':'−'}${cop(Math.abs(gan))}</b><span>Ganancia sobre inversión</span></div><div><b>${atr?cop(inv/atr):'—'}</b><span>Costo por cliente</span></div>`
    :`<div><b>${cop(val)}</b><span>Generó</span></div><div><b>${pct(cer,atr)}%</b><span>Tasa de cierre</span></div><div><b>${cer&&val?cop(val/cer):'—'}</b><span>Por venta</span></div>`;
  const noC=Math.max(0,atr-cer),exp=Object.values(RZ).reduce((a,b)=>a+b,0);
  $('#v_raz').innerHTML=RAZONES.map(([k,t])=>`<div class="razon"><span>${t}</span><div class="cnt"><button type="button" data-rz="${k}" data-d="-1">−</button><b>${RZ[k]||0}</b><button type="button" data-rz="${k}" data-d="1">+</button></div></div>`).join('');
  const n=$('#v_rnota');
  if(cer>atr){n.className='nota-r mal';n.textContent='Hay más ventas cerradas que clientes atraídos: revisa los números.';}
  else if(!noC){n.className='nota-r';n.textContent=atr?'Se cerró venta con todos los clientes atraídos 🙌':'Anota cuántos clientes atrajo el contenido.';}
  else if(exp===noC){n.className='nota-r ok';n.textContent=`Explicaste los ${noC} clientes que no compraron.`;}
  else if(exp>noC){n.className='nota-r mal';n.textContent=`Marcaste ${exp} razones pero solo ${noC} no compraron.`;}
  else{n.className='nota-r mal';n.textContent=`${noC} no compraron · ${noC-exp} sin razón anotada.`;}
}

    it.pauta={si,inversion:si?g('p_inv'):0,dias:si?g('p_dias'):0};
    const rz={};Object.entries(RZ).forEach(([k,v])=>{if(v>0)rz[k]=v;});
    it.ventas={atraidos:atr,cerrados:cer,valor:g('v_val'),razones:rz,nota:$('#v_nota').value.trim(),ts:Date.now()};
    tocar(it);guardar();cerrarFicha();toast('💰 Pauta y ventas guardadas');}
};
/* ===================== calendario ===================== */
let CAL=null,CSEL=null;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fechaDe=it=>it.tsPub?iso(new Date(it.tsPub)):(it.fechaPlan||'');
function pintarCal(){
  const hoy=new Date();if(!CAL)CAL=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const y=CAL.getFullYear(),m=CAL.getMonth(),ini=new Date(y,m,1),off=(ini.getDay()+6)%7,start=new Date(y,m,1-off);
  const porDia={};DB.items.forEach(it=>{const f=fechaDe(it);if(f)(porDia[f]=porDia[f]||[]).push(it);});
  let h=`<div class="cal-cab"><button class="nav" data-cm="-1" aria-label="Mes anterior">‹</button><h2>${cap(CAL.toLocaleDateString('es-CO',{month:'long'}))} ${y}</h2><button class="nav" data-cm="1" aria-label="Mes siguiente">›</button></div>
  <div class="cal">${['L','M','M','J','V','S','D'].map(d=>`<div class="dn">${d}</div>`).join('')}`;
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(i>=35&&d.getMonth()!==m)break;const k=iso(d),L=(porDia[k]||[]);
    h+=`<div class="dia ${d.getMonth()!==m?'fuera':''} ${k===iso(hoy)?'hoy':''} ${CSEL===k?'sel':''}" data-dia="${k}"><span class="n">${d.getDate()}</span><div class="evs">${L.slice(0,3).map(it=>{const e=etapa(it);return `<div class="ev ${e.c}" data-ic="${(GUIA[it.formato]||{}).ic||'•'}" title="${esc(it.titulo)}">${(GUIA[it.formato]||{}).ic||''} ${esc(it.titulo)}</div>`;}).join('')}</div>${L.length>3?`<span class="mas-ev">+${L.length-3} más</span>`:''}</div>`;}
  h+=`</div><div class="leyenda"><span class="pill s-idea">💡 Idea planeada</span><span class="pill s-espera">⏳ En 48 h</span><span class="pill s-medir">📏 Por medir</span><span class="pill s-medido">📊 Medido</span><span class="pill s-ventas">💰 Con ventas</span></div>`;
  if(CSEL){const L=porDia[CSEL]||[];const d=new Date(CSEL+'T12:00');
    h+=`<div class="dia-det"><h3>${cap(d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}))}</h3>${L.map(it=>{const e=etapa(it);return `<div class="fila-c" data-ver="${it.id}">${(GUIA[it.formato]||{}).ic||'📄'}<b>${esc(it.titulo)}</b><span class="pill ${e.c}">${e.t}</span></div>`;}).join('')||'<p class="nota-r" style="margin-bottom:10px">Nada planeado este día.</p>'}
    <button class="btn am" data-nuevo-dia="${CSEL}">+ Idea para este día</button></div>`;}
  const sin=DB.items.filter(it=>!fechaDe(it));
  if(sin.length)h+=`<div class="h3s">Ideas sin fecha · ${sin.length}</div>${sin.map(it=>`<div class="fila-c" data-ver="${it.id}">${(GUIA[it.formato]||{}).ic||'💡'}<b>${esc(it.titulo)}</b><span class="pill s-idea">Sin fecha</span></div>`).join('')}`;
  $('#cal').innerHTML=h;
}
$('#cal').addEventListener('click',e=>{
  const n=e.target.closest('[data-cm]');if(n){CAL=new Date(CAL.getFullYear(),CAL.getMonth()+(+n.dataset.cm),1);CSEL=null;pintarCal();return;}
  const v=e.target.closest('[data-ver]');if(v){abrirFicha(v.dataset.ver);return;}
  const nd=e.target.closest('[data-nuevo-dia]');if(nd){irTab('nuevo',1);montarNuevo({fechaPlan:nd.dataset.nuevoDia});return;}

});

/* ===================== lo que funciona ===================== */
let ORDEN='ventas';
const ORDENES=[['ventas','💰 Ventas'],['retorno','📣 Retorno pauta'],['vistas','👁 Vistas'],['seguidores','➕ Seguidores'],['mensajes','💬 Mensajes']];
function metrica(it,k){const r=it.r48||{},v=it.ventas||{};
  if(k==='ventas')return +v.valor||0;

function arreglarStr(s){let o='',en=false,e=false;for(const c of s){if(en){if(e){e=false;o+=c;continue;}if(c==='\\'){e=true;o+=c;continue;}if(c==='"')en=false;else if(c==='\n'){o+='\\n';continue;}else if(c==='\r')continue;else if(c==='\t'){o+='\\t';continue;}o+=c;}else{if(c==='"')en=true;o+=c;}}return o;}
function extraerJSON(txt){txt=txt||'';const m=txt.match(/```(?:json)?\s*([\s\S]*?)(```|$)/i);const raw=m?m[1]:txt;const a=raw.indexOf('[');if(a<0)return null;
  const b=raw.lastIndexOf(']');if(b>a){try{const j=JSON.parse(raw.slice(a,b+1));if(Array.isArray(j)&&j.length)return j;}catch(e){}}
  /* rescate objeto por objeto, arreglando saltos de línea dentro de los textos */
  const out=[];let prof=0,ini=-1,enStr=false,esc2=false;
  for(let i=a+1;i<raw.length;i++){const c=raw[i];
    if(enStr){if(esc2)esc2=false;else if(c==='\\')esc2=true;else if(c==='"')enStr=false;continue;}
    if(c==='"'){enStr=true;continue;}
    if(c==='{'){if(prof===0)ini=i;prof++;}
    else if(c==='}'){prof--;if(prof===0&&ini>=0){let s=raw.slice(ini,i+1);try{out.push(JSON.parse(s));}catch(e){try{out.push(JSON.parse(arreglarStr(s)));}catch(e2){}}ini=-1;}}}
  return out.length?out:null;}

  const map={};[...(R.items||[]),...(L.items||[])].forEach(i=>{if(!i||!i.id)return;if(!map[i.id]||tIt(i)>tIt(map[i.id]))map[i.id]=i;});

  /* números SE-xxx repetidos (creados a la vez en dos equipos): se renumeran de forma determinista */
  const usados=new Set();let max=items.reduce((m,i)=>Math.max(m,parseInt((i.num||'').split('-')[1],10)||0),0);
  items.forEach(i=>{if(usados.has(i.num)){i.num='SE-'+String(++max).padStart(3,'0');}usados.add(i.num);});
  const seg={};[...(R.seguidores||[]),...(L.seguidores||[])].forEach(s=>{if(s&&s.id)seg[s.id]=s;});
  const lot={};[...(R.lotes||[]),...(L.lotes||[])].forEach(x=>{if(!x||!x.id)return;const o=lot[x.id];lot[x.id]=o?{...x,cargadas:[...new Set([...(o.cargadas||[]),...(x.cargadas||[])])]}:x;});
  return {lotes:Object.values(lot).sort((a,b)=>a.ts-b.ts).slice(-15),items,del:Object.values(del).filter(d=>d.ts>lim),seguidores:Object.values(seg).sort((a,b)=>a.ts-b.ts).slice(-120)};
}
let fbPulling=false,fbLast=0;
function fbPull(force){
  if(fbPulling||(!force&&Date.now()-fbLast<3000))return Promise.resolve();
  fbPulling=true;fbLast=Date.now();
  return fetch(FB+'__manifest').then(r=>r.ok?r.json():null).then(doc=>{
    const f=(doc&&doc.fields)||{};const ts=parseInt((f[SKEY]||{}).integerValue||'0',10);
    if(ts>(parseInt(localStorage.getItem('__ts_'+SKEY)||'0',10))){
      return fetch(FB+encodeURIComponent(SKEY)).then(r=>r.ok?r.json():null).then(d=>{
        const rem=d&&d.fields&&d.fields.data&&d.fields.data.stringValue;if(rem==null)return;
        const locStr=localStorage.getItem(SKEY);let R=null;try{R=JSON.parse(rem);}catch(e){}
        const out=JSON.stringify(fusion(JSON.parse(locStr||'null'),R));
        localStorage.setItem('__ts_'+SKEY,String(ts));
        if(out!==locStr){localStorage.setItem(SKEY,out);DB=JSON.parse(out);if(FID)pintarFicha();pintar();}
        if(out!==rem)fbSave(SKEY,out);
      });
    }
    if(!f[SKEY]){const v=localStorage.getItem(SKEY);if(v!=null)fbSave(SKEY,v);}
  }).then(()=>{if(!obMio().length)syncDot('ok');}).catch(()=>syncDot(navigator.onLine===false?'off':'err')).then(()=>{fbPulling=false;});
}
function syncDot(st){const b=$('#syncDot');b.className='sync '+st;$('#syncTxt').textContent={ok:'Sincronizado',run:'Sincronizando',err:'Sin conexión',off:'Offline'}[st]||'Local';}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')fbFlushAll();else fbPull(true);});
window.addEventListener('focus',()=>fbPull());
window.addEventListener('online',()=>{fbFlushAll();fbPull(true);});
window.addEventListener('offline',()=>syncDot('off'));
window.addEventListener('beforeunload',fbFlushAll);
setInterval(()=>{if(document.visibilityState==='visible')fbPull();},10000);
setInterval(()=>{if(navigator.onLine!==false&&obMio().length)fbFlushAll();},15000);

pintar();
fbPull(true);
if(location.hash==='#cuentas'){history.replaceState(null,'',location.pathname);irCuentas();}
merRemoto().then(()=>{pintar();if(FID&&PASO===3)pintarFicha();});misRemoto();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')merRemoto().then(pintar);});
</script>
<script>/* volver al cuarto: si este módulo se abrió en su propia pestaña desde el Hub, se cierra y queda la pestaña del cuarto */
document.addEventListener('click',e=>{const a=e.target.closest('a.volver');if(!a)return;
  let op=null;try{op=window.opener&&!window.opener.closed?window.opener:null;}catch(_){op=null;}
  if(op&&/^fambit_/.test(window.name)){e.preventDefault();try{op.focus();}catch(_){}window.close();setTimeout(()=>{location.href=a.href;},300);}});</script>
