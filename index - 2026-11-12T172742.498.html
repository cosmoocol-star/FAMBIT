<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060930">
<title>Fambit Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Sulphur+Point:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* ===== Manual de marca Fambit ===== */
:root{
  --navy:#0A128A; --lila:#5852F2; --azul:#2643E9; --naranja:#FFA800; --amarillo:#FFD42E;
  --crema:#ECEAE3; --tinta:#F5F4FF; --tinta2:#C4C6F5;
  --titulo:'Comfortaa',system-ui,sans-serif; --texto:'Sulphur Point',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#060930}html,body{height:100%;background:var(--navy);color:var(--tinta);font-family:var(--texto)}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 45% at 50% 40%, rgba(88,82,242,.28), transparent 70%),
    radial-gradient(ellipse 45% 30% at 12% 85%, rgba(38,67,233,.18), transparent 70%),
    radial-gradient(ellipse 40% 28% at 90% 12%, rgba(255,212,46,.06), transparent 70%),
    #060930;}

/* elementos gráficos flotantes de la marca */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute;animation:flota 9s ease-in-out infinite}
@keyframes flota{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(6deg)}}

header{position:relative;z-index:2;flex:none;width:100%;max-width:1200px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
.marca{display:flex;align-items:center;gap:14px}
.marca img{height:46px;width:auto;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
.marca .sep{width:1.5px;height:34px;background:rgba(255,212,46,.55);border-radius:2px}
.marca h1{font-family:var(--titulo);font-weight:700;font-size:20px;line-height:1;letter-spacing:.3px}
.marca h1 span{color:var(--amarillo)}
.marca p{font-size:13px;color:var(--tinta2);margin-top:5px;letter-spacing:.4px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--titulo);font-weight:700;font-size:11px;letter-spacing:.6px;padding:7px 13px;border-radius:999px;border:1.5px solid rgba(196,198,245,.22);color:var(--tinta)}
.tag.am{background:var(--amarillo);border-color:var(--amarillo);color:var(--navy)}

main{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto;padding:4px 8px;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
svg#cuarto{width:100%;height:100%;display:block;overflow:visible}
svg#cuarto.zoom{overflow:hidden;touch-action:pan-y;cursor:grab}
svg#cuarto.zoom.arrastrando{cursor:grabbing}
.desliza{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;background:rgba(11,14,51,.9);border:1px solid rgba(143,139,255,.4);color:#C4C6F5;font-family:var(--titulo);font-weight:700;font-size:12px;padding:7px 12px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .4s}
.desliza.on{opacity:1}

.obj{transition:transform .3s ease, filter .3s ease}
.sube{transition:transform .9s cubic-bezier(.45,0,.2,1)}
.perilla{transform-box:fill-box;transform-origin:center;transition:transform .6s steps(9,end)}
.hoja-caja{transform-box:fill-box;transform-origin:0% 50%;transition:transform .5s cubic-bezier(.5,0,.25,1.15) .78s}
.interior-caja{opacity:0;transition:opacity .3s .85s}
.destello{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.3);pointer-events:none}
.sale{opacity:0;pointer-events:none}
.tecla{transition:fill .1s}.led-caja{transition:fill .2s}
.caja-abierta .t4{fill:#FFD42E;transition-delay:.05s}.caja-abierta .t0{fill:#FFD42E;transition-delay:.18s}.caja-abierta .t8{fill:#FFD42E;transition-delay:.31s}.caja-abierta .t2{fill:#FFD42E;transition-delay:.44s}
.caja-abierta .led-caja{fill:#2BD67B;transition-delay:.55s}
.caja-abierta .destello{animation:destello .9s cubic-bezier(.2,.8,.2,1) 1s forwards}
@keyframes destello{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1.1)}100%{opacity:.85;transform:scale(1.35)}}
.caja-abierta .sale{animation:sale .8s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes sale{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}70%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1.15)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) - 14px)) scale(.9)}}
@keyframes sacude{0%,100%{transform:translateX(0)}20%{transform:translateX(-1.6px)}40%{transform:translateX(1.6px)}60%{transform:translateX(-1px)}80%{transform:translateX(1px)}}
.obj.caja-abierta{animation:sacude .22s ease .62s}
#cuarto.zoom-caja{transition:transform .65s cubic-bezier(.45,0,.2,1);transform:scale(2.8)}
#cuarto.zoom-caja .pin{opacity:0;transition:opacity .2s}
.velo-entrar.oro{background:radial-gradient(circle at 50% 55%,#5A4300 0%,#1A1440 45%,#060930 75%)}
@media (prefers-reduced-motion:reduce){.caja-abierta .destello,.caja-abierta .sale,.obj.caja-abierta{animation:none}#cuarto.zoom-caja{transform:none}}
.caja-abierta .perilla{transform:rotate(540deg)}
.caja-abierta .hoja-caja{transform:scaleX(.12) skewY(-14deg)}
.caja-abierta .interior-caja{opacity:1}
.cont{cursor:pointer}.cont:hover{filter:brightness(1.35) drop-shadow(0 0 6px #FFD42E)}
.vapor{animation:vapor 3.2s ease-in-out infinite}
@keyframes vapor{0%,100%{opacity:.15;transform:translateY(1px)}50%{opacity:.6;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.vapor{animation:none}}
#cuarto.alto .sube{transform:translateY(-14px)}
@media (prefers-reduced-motion:reduce){.sube{transition:none}}
.obj:hover,.obj.hl{filter:brightness(1.2) drop-shadow(0 0 12px rgba(88,82,242,.45));transform:translateY(-3px)}
.pin{transition:transform .2s ease}
.obj.sel{filter:brightness(1.25) drop-shadow(0 0 14px rgba(255,212,46,.45));transform:translateY(-3px)}
.pin.sel .pill-bg{fill:#2A2F9E}.pin.sel .pill-out{stroke-width:2.6;opacity:1}.pin.sel text{fill:#FFD42E}
.umbral{opacity:0;transition:opacity .5s ease .1s}
.hoja{transform-box:view-box;transform-origin:0 0;transition:transform .75s cubic-bezier(.6,.05,.3,1)}
.abierta .hoja{transform:scaleX(.08) skewY(-14deg)}
.abierta .umbral{opacity:1}
.luz-piso{transition:opacity .6s ease .2s}.abierta~.luz-piso,.abierta .luz-piso{opacity:.35}
.entrada{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(420px,calc(100% - 24px));z-index:40;background:rgba(14,18,74,.97);border:1.5px solid rgba(143,139,255,.45);border-radius:20px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .22s ease}
.entrada.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.entrada .ic{font-size:28px;flex:none}
.entrada .tx{flex:1;min-width:0}
.entrada b{font-family:var(--titulo);font-size:17px;display:block}
.entrada p{font-size:12px;color:var(--tinta2);margin-top:3px;line-height:1.35}
.entrada .go{border:none;border-radius:14px;padding:12px 16px;font-family:var(--titulo);font-weight:700;font-size:14px;background:var(--amarillo);color:var(--navy);cursor:pointer;flex:none;white-space:nowrap}
.entrada .go:active{transform:scale(.96)}
.entrada .pronto{font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--tinta3);border:1.5px dashed rgba(196,198,245,.3);border-radius:12px;padding:10px 12px;flex:none}
.entrada .x{position:absolute;top:6px;right:8px;border:none;background:none;color:var(--tinta3);font-size:14px;cursor:pointer;padding:4px}
.velo-entrar{position:fixed;inset:0;z-index:60;background:#060930;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .45s ease}
.velo-entrar.on{opacity:1;pointer-events:auto}
.velo-entrar img{height:58px;animation:latido 1.2s ease-in-out infinite}
.velo-entrar span{font-family:var(--titulo);font-weight:700;color:var(--amarillo);letter-spacing:.5px}
@keyframes latido{50%{transform:scale(1.06)}}

.pin .pill-bg,.pin text{transition:fill .2s ease}
.pin.hl .pill-bg{fill:#2A2F9E}
.pin.hl .pill-out{stroke-width:2.4;opacity:1}
.pin.hl text{fill:#FFD42E}
.obj[data-z],.pin[data-z]{cursor:pointer}
.pin text{font-family:var(--titulo);font-weight:700;font-size:13px;fill:#fff;pointer-events:none}
.pin .anillo{animation:pulso 2.4s infinite ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pulso{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.foco{animation:foco 2.8s infinite ease-in-out}
@keyframes foco{0%,100%{opacity:1}50%{opacity:.35}}
.brillo{animation:brillo 3.5s infinite ease-in-out}
@keyframes brillo{0%,100%{opacity:.8}50%{opacity:1}}
.vivo{animation:foco 1.2s infinite}
.moneda{animation:moneda 2.6s infinite ease-in-out}
@keyframes moneda{0%{transform:translateY(0);opacity:0}25%{opacity:1}70%{transform:translateY(-14px);opacity:1}100%{transform:translateY(-18px);opacity:0}}
.neon{animation:neon 5s infinite}
@keyframes neon{0%,16%,20%,100%{opacity:1}18%{opacity:.35}}

footer{position:relative;z-index:1;flex:none;width:100%;max-width:1200px;margin:0 auto;padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:nowrap;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:var(--tinta2);letter-spacing:.5px}
footer b{color:var(--amarillo);font-weight:700}
.escena{flex:1;min-height:0;display:flex;flex-direction:column;width:100%}
.dock{display:none}
@media (min-width:900px) and (min-height:520px){
  .escena{flex-direction:row;align-items:center;max-width:1400px;margin:0 auto;gap:8px;padding:0 20px}
  .escena main{max-width:none;height:100%}
  .dock{display:flex;flex-direction:column;gap:8px;width:236px;flex:none;padding:16px;border-radius:22px;background:rgba(11,14,51,.72);border:1px solid rgba(196,198,245,.14);position:relative;z-index:2}
  .dock::before{content:'MÓDULOS';font-family:var(--titulo);font-weight:700;font-size:11px;letter-spacing:2px;color:var(--tinta3);margin:0 4px 4px}
  .dk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1.5px solid transparent;background:transparent;color:var(--tinta);font-family:var(--titulo);font-weight:700;font-size:14px;text-align:left;text-decoration:none;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
  .dk:hover{background:rgba(88,82,242,.18)}
  .dk .ic{font-size:20px;width:26px;text-align:center;flex:none}
  .dk small{display:block;font-family:var(--texto);font-weight:700;font-size:11px;color:var(--tinta3);margin-top:1px}
  .dk.pr{display:flex;flex-direction:row}
  .dk.pr small{order:3;margin-left:auto}
  .dk.act{background:var(--amarillo);color:var(--navy);padding:14px 12px;margin-bottom:6px}
  .dk.act small{color:rgba(10,18,138,.7)}
  .dk.act .tx{display:flex;flex-direction:column}
  .dk.act:hover{background:#FFE066}
  .dk.on{border-color:var(--lila2);background:rgba(88,82,242,.3)}
  .dk.act.on{background:var(--amarillo);border-color:#fff;box-shadow:0 0 0 3px rgba(255,212,46,.35)}
  .dk:active{transform:scale(.98)}
}
@media (max-width:700px) and (orientation:portrait){
  .dock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:none;width:100%;padding:4px 12px 10px;position:relative;z-index:2}
  .dk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:66px;border-radius:16px;border:1.5px solid rgba(196,198,245,.18);background:rgba(15,19,80,.85);color:var(--tinta);font-family:var(--titulo);font-weight:700;font-size:12px;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .2s,border-color .2s}
  .dk .ic{font-size:20px;line-height:1}
  .dk small{font-family:var(--texto);font-weight:700;font-size:10px;color:var(--tinta3);letter-spacing:.4px}
  .dk.act{grid-column:span 2;flex-direction:row;gap:12px;background:var(--amarillo);border-color:var(--amarillo);color:var(--navy);font-size:16px}
  .dk.act .ic{font-size:26px}.dk.act small{color:rgba(10,18,138,.7);font-size:11px;display:block}
  .dk.act .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
  .dk:active{transform:scale(.96)}
  .dk.pr{opacity:.8}
  .dk.on{border-color:var(--lila2);background:rgba(88,82,242,.35)}
  .dk.act.on{background:var(--amarillo);border-color:#fff;box-shadow:0 0 0 3px rgba(255,212,46,.35)}
  main{padding:0 4px}
}
.estado{display:flex;align-items:center;gap:8px;font-family:var(--titulo);font-weight:700;font-size:12px;color:var(--tinta)}
.estado i{width:8px;height:8px;border-radius:50%;background:var(--naranja);box-shadow:0 0 0 3px rgba(255,168,0,.25);animation:foco 1.8s infinite}
@media (max-width:560px){
  header{padding:16px 16px 0}.marca img{height:38px}.marca h1{font-size:17px}
  .tags{gap:6px;flex:none}.tag{font-size:10px;padding:6px 10px;white-space:nowrap}.tag:not(.am){display:none}
  .marca{gap:10px;min-width:0}.marca p{font-size:12px}
  footer{font-size:11px;padding:8px 14px calc(8px + env(safe-area-inset-bottom))}.estado{font-size:11px}.estado .largo{display:none}
  main{padding:0}
}

/* ===== MISIONES (panel dentro del index) ===== */
.dk.pr.vivo{opacity:1!important}.dk.vivo small{color:#FFD42E!important}
.mis{position:fixed;inset:0;z-index:50;background:rgba(3,5,30,.74);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease}
.mis.on{opacity:1;pointer-events:auto}
.mis-caja{position:relative;width:min(900px,calc(100% - 32px));height:min(92dvh,920px);display:flex;flex-direction:column;overflow:hidden;border-radius:24px;border:1.5px solid rgba(143,139,255,.35);box-shadow:0 30px 80px rgba(0,0,0,.6);transform:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),radial-gradient(ellipse 80% 40% at 50% 0%,rgba(88,82,242,.22),transparent 70%),#0B0E33}
.mis.on .mis-caja{transform:none}
.mis-caja{transition:none;transform:none}
.mis.saliendo{background:rgba(3,5,30,0);transition:background .4s ease}
.obj.encender{animation:encender .38s steps(1,end)}
@keyframes encender{0%{filter:brightness(1)}15%{filter:brightness(2.6) drop-shadow(0 0 10px #8F8BFF)}30%{filter:brightness(.6)}45%{filter:brightness(2.8) drop-shadow(0 0 14px #FFD42E)}70%{filter:brightness(1.8) drop-shadow(0 0 18px #8F8BFF)}100%{filter:brightness(2.2) drop-shadow(0 0 22px #8F8BFF)}}
.mis-caja::after{content:"";position:absolute;left:0;right:0;top:-12%;height:12%;pointer-events:none;opacity:0;z-index:6;background:linear-gradient(180deg,transparent,rgba(143,139,255,.18) 60%,rgba(255,255,255,.55) 96%,transparent)}
.mis-caja.boot::after{animation:barrido .75s .35s ease-out both}
@keyframes barrido{0%{top:-12%;opacity:1}100%{top:104%;opacity:.7}}
.mis-caja.boot .mis-top,.mis-caja.boot .mm,.mis-caja.boot .mh,.mis-caja.boot .xpbar,.mis-caja.boot .chips,.mis-caja.boot .mc,.mis-caja.boot .vacio,.mis-caja.boot .mis-nueva{animation:subir .4s cubic-bezier(.2,.8,.2,1) both}
.mis-caja.boot .mis-top{animation-delay:.32s}
.mis-caja.boot .mm:nth-child(1){animation-delay:.38s}.mis-caja.boot .mm:nth-child(2){animation-delay:.43s}.mis-caja.boot .mm:nth-child(3){animation-delay:.48s}.mis-caja.boot .mm:nth-child(4){animation-delay:.53s}
.mis-caja.boot .mh,.mis-caja.boot .xpbar{animation-delay:.5s}.mis-caja.boot .chips{animation-delay:.56s}
.mis-caja.boot .mc,.mis-caja.boot .vacio{animation-delay:.62s}.mis-caja.boot .mc:nth-of-type(2){animation-delay:.67s}.mis-caja.boot .mc:nth-of-type(3){animation-delay:.72s}
.mis-caja.boot .mis-nueva{animation-delay:.7s}
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vacio.grande{display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 20px}
.vacio .vic{font-size:34px;width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:rgba(88,82,242,.15);border:1.5px solid rgba(143,139,255,.3);margin-bottom:6px;animation:flota 3s ease-in-out infinite}
.vacio.grande b{font-family:var(--titulo);font-size:16px;color:var(--tinta)}
.vacio.grande span{max-width:320px;line-height:1.4}
.vbtn{margin-top:10px;border:none;border-radius:14px;padding:11px 18px;background:#5852F2;color:#fff;font-family:var(--titulo);font-weight:700;font-size:14px;cursor:pointer}
@keyframes flota{50%{transform:translateY(-4px)}}
.mis-top{flex:none;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(196,198,245,.12)}
.mis-top h2{font-family:var(--titulo);font-size:18px;flex:1;display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.mis-top h2 small{font-family:var(--texto);font-weight:700;font-size:12px;color:#8F8BFF;letter-spacing:.3px}
.mis-volver{border:1.5px solid rgba(196,198,245,.25);background:rgba(88,82,242,.12);color:var(--tinta);border-radius:12px;padding:8px 12px;font-family:var(--titulo);font-weight:700;font-size:12px;cursor:pointer}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#8F8BFF}
.sync i{width:8px;height:8px;border-radius:50%;background:#8F8BFF}
.sync.ok i{background:#2BD67B}.sync.run i{background:#FFD42E;animation:foco 1s infinite}.sync.err i,.sync.off i{background:#FF6B6B}
.mis-mundos{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 18px}
.mm{position:relative;text-align:left;border:1.5px solid rgba(196,198,245,.16);background:rgba(17,21,74,.8);color:var(--tinta);border-radius:16px;padding:10px 12px;cursor:pointer;min-width:0;transition:border-color .2s,transform .15s}
.mm:active{transform:scale(.97)}
.mm small{display:block;font-family:var(--titulo);font-weight:700;font-size:10px;letter-spacing:1.2px;color:#8F8BFF}
.mm b{display:block;font-family:var(--titulo);font-size:14px;margin:3px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .bar{height:6px;border-radius:3px;background:#1B2063;overflow:hidden}.mm .bar i{display:block;height:100%;background:linear-gradient(90deg,#5852F2,#8F8BFF);border-radius:3px}
.mm .pc{position:absolute;top:9px;right:11px;font-size:11px;font-weight:700;color:var(--tinta2)}
.mm.on{border-color:#FFD42E;box-shadow:0 0 0 3px rgba(255,212,46,.18)}.mm.on small{color:#FFD42E}
.mm.lock{opacity:.55}.mm.full .bar i{background:#FFD42E}
.mis-cuerpo{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 90px;-webkit-overflow-scrolling:touch}
.mh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:6px 0 12px}
.mh h3{font-family:var(--titulo);font-size:22px}.mh p{font-size:13px;color:var(--tinta2);margin-top:4px;line-height:1.35}
.mh .xpbig{text-align:right;flex:none}.mh .xpbig b{font-family:var(--titulo);font-size:20px;color:#FFD42E}.mh .xpbig span{display:block;font-size:11px;color:var(--tinta2);font-weight:700}
.xpbar{height:10px;border-radius:5px;background:#1B2063;overflow:hidden;margin-bottom:14px;position:relative}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#5852F2,#8F8BFF);border-radius:5px;transition:width .5s ease}
.aviso{font-size:12px;color:#FFD42E;background:rgba(255,212,46,.08);border:1px dashed rgba(255,212,46,.35);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid rgba(196,198,245,.2);background:transparent;color:var(--tinta2);border-radius:999px;padding:6px 12px;font-family:var(--titulo);font-weight:700;font-size:12px;cursor:pointer}
.chip.on{background:#5852F2;border-color:#5852F2;color:#fff}
.mc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;background:rgba(19,24,90,.85);border:1.5px solid rgba(196,198,245,.12);border-radius:16px;padding:12px;margin-bottom:8px;transition:border-color .2s}
.mc.prio{border-color:rgba(255,212,46,.55)}
.mc-chk{width:30px;height:30px;border-radius:9px;border:2px solid #8F8BFF;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;margin-top:1px}
.mc.ok .mc-chk{background:#5852F2;border-color:#5852F2}
.mc-tx{cursor:pointer;min-width:0}
.mc-tx b{display:block;font-family:var(--titulo);font-size:15px;line-height:1.3}
.mc.ok .mc-tx b{color:#8F8BFF;text-decoration:line-through}
.mc-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;font-size:12px;font-weight:700;color:var(--tinta2)}
.mc-meta .xp{color:#FFD42E}.mc-meta .venc{color:#FF8A8A}
.mc-gear{border:none;background:none;color:#8F8BFF;font-size:18px;cursor:pointer;padding:2px 4px}
.prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.prog .bar{flex:1;height:7px;border-radius:4px;background:#1B2063;overflow:hidden}.prog .bar i{display:block;height:100%;background:#FFD42E;border-radius:4px}
.prog span{font-size:12px;font-weight:700;color:var(--tinta);white-space:nowrap}
.mc-det{grid-column:2/4;border-top:1px solid rgba(196,198,245,.1);margin-top:8px;padding-top:10px}
.paso{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;cursor:pointer}
.paso i{width:20px;height:20px;border-radius:6px;border:1.8px solid #8F8BFF;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#fff}
.paso.ok i{background:#5852F2;border-color:#5852F2}.paso.ok span{color:#8F8BFF;text-decoration:line-through}
.avance{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--tinta2);font-weight:700;flex-wrap:wrap}
.avance button{width:34px;height:34px;border-radius:10px;border:1.5px solid rgba(196,198,245,.25);background:rgba(88,82,242,.15);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.avance input{width:90px;text-align:center}
.mis input,.mis select,.mis textarea{background:#11154A;border:1.5px solid rgba(196,198,245,.2);color:var(--tinta);border-radius:10px;padding:9px 10px;font-family:var(--texto);font-size:15px;font-weight:700;width:100%;outline:none}
.mis input:focus,.mis select:focus,.mis textarea:focus{border-color:#8F8BFF}
.vacio{text-align:center;color:var(--tinta2);font-size:13px;padding:22px 10px;border:1.5px dashed rgba(196,198,245,.18);border-radius:16px;margin-bottom:8px}
.mis-nueva{position:absolute;right:18px;bottom:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:3;border:none;border-radius:16px;padding:14px 20px;background:#FFD42E;color:#0A128A;font-family:var(--titulo);font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.mis-nueva:active{transform:scale(.96)}
.mis-form{position:absolute;inset:0;z-index:5;background:rgba(3,5,30,.7);display:none;align-items:flex-end;justify-content:center}
.mis-form.on{display:flex}
.mf{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:#0E1250;border:1.5px solid rgba(143,139,255,.35);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:701px){.mis-form{align-items:center}.mf{border-radius:22px}}
.mf h3{font-family:var(--titulo);font-size:18px;margin-bottom:14px}
.mf label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:#8F8BFF;margin:12px 0 6px;text-transform:uppercase}
.mf .fila{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mf .xps{display:flex;gap:6px;flex-wrap:wrap}
.mf .acc{display:flex;gap:10px;margin-top:18px}
.mf .acc button{flex:1;border:none;border-radius:14px;padding:13px;font-family:var(--titulo);font-weight:700;font-size:14px;cursor:pointer}
.mf .ok{background:#FFD42E;color:#0A128A}.mf .no{background:rgba(196,198,245,.12);color:var(--tinta)}
.mf .borrar{display:block;width:100%;margin-top:12px;border:1.5px solid rgba(255,107,107,.4);background:transparent;color:#FF8A8A;border-radius:14px;padding:11px;font-family:var(--titulo);font-weight:700;font-size:13px;cursor:pointer}
.mf .ayuda{font-size:11px;color:var(--tinta2);margin-top:5px}
.xpfly{position:fixed;z-index:70;pointer-events:none;font-family:var(--titulo);font-weight:700;font-size:18px;color:#FFD42E;text-shadow:0 0 12px rgba(255,212,46,.6);animation:xpfly 1.1s ease-out forwards}
@keyframes xpfly{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-150%);z-index:80;background:#11154A;border:1.5px solid rgba(143,139,255,.45);color:var(--tinta);border-radius:14px;padding:10px 16px;font-family:var(--titulo);font-weight:700;font-size:13px;transition:transform .3s ease;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{transform:translate(-50%,0)}
@media (max-width:700px){
  .mis-caja{width:100%;height:100dvh;border-radius:0;border:none}
  .mis-top{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));gap:10px}
  .mis-top h2{font-size:16px}#syncTxt{display:none}
  .mis-mundos{display:flex;overflow-x:auto;padding:10px 14px;scrollbar-width:none}.mis-mundos::-webkit-scrollbar{display:none}
  .mm{flex:none;width:138px}
  .mis-cuerpo{padding:4px 14px 96px}
  .mh h3{font-size:19px}
}
</style>
</head>

/* ===== MOTOR ISOMÉTRICO ===== */
const OX=370, OY=345, C=0.866;
const S=(x,y,z)=>[OX+(x-y)*C, OY+(x+y)*0.5-z];
const pt=p=>S(...p).map(n=>n.toFixed(1)).join(',');
const poly=(pts,fill,ex='')=>`<polygon points="${pts.map(pt).join(' ')}" fill="${fill}" ${ex}/>`;
function sh(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f>1?v+(255-v)*(f-1):v*f)));
  return '#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function box(x,y,z,w,d,h,c){
  return poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],sh(c,0.84))+
         poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],sh(c,0.66))+
         poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],sh(c,1.14));
}
const enDer=(x,z)=>{const[a,b]=S(x,0,z);return `matrix(${C} 0.5 0 1 ${a} ${b})`};       // pared derecha
const enIzq=(y,z)=>{const[a,b]=S(0,y,z);return `matrix(${C} -0.5 0 1 ${a} ${b})`};      // pared izquierda
const enCaraX=(x,y,z)=>{const[a,b]=S(x,y,z);return `matrix(${C} -0.5 0 1 ${a} ${b})`};
const enPiso=(x,y)=>{const[a,b]=S(x,y,0);return `matrix(${C} 0.5 ${-C} 0.5 ${a} ${b})`};  // plano del piso

/* elementos gráficos de la marca (en coordenadas locales) */
const EL={
  play:(x,y,s,c)=>`<path d="M${x} ${y} l${s} ${s*.6} l${-s} ${s*.6}z" fill="${c}"/>`,
  playL:(x,y,s,c)=>`<path d="M${x} ${y} l${s} ${s*.6} l${-s} ${s*.6}z" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>`,
  mas:(x,y,s,c)=>`<path d="M${x-s} ${y}h${2*s}M${x} ${y-s}v${2*s}" stroke="${c}" stroke-width="${s*.75}" stroke-linecap="round"/>`,
  equis:(x,y,s,c)=>`<path d="M${x-s} ${y-s}l${2*s} ${2*s}M${x+s} ${y-s}l${-2*s} ${2*s}" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`,
  aro:(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${c}" stroke-width="2.2"/>`,
  cuadro:(x,y,s,c)=>`<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${s*.22}" fill="none" stroke="${c}" stroke-width="2.2"/>`,
  puntos:(x,y,c)=>{let p='';for(let i=0;i<3;i++)for(let j=0;j<3;j++)p+=`<circle cx="${x+i*7}" cy="${y+j*7}" r="1.5" fill="${c}"/>`;return p;},
  destello:(x,y,r,c)=>{let p='';for(let i=0;i<12;i++){const a=i*Math.PI/6,r1=r*.45,r2=i%2?r*.8:r;p+=`<line x1="${(x+Math.cos(a)*r1).toFixed(1)}" y1="${(y+Math.sin(a)*r1).toFixed(1)}" x2="${(x+Math.cos(a)*r2).toFixed(1)}" y2="${(y+Math.sin(a)*r2).toFixed(1)}" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/>`}return p;}
};

const glow=(x,y,z,rx,ry,g,cl='')=>{const[a,b]=S(x,y,z);return `<ellipse class="${cl}" cx="${a}" cy="${b}" rx="${rx}" ry="${ry}" fill="url(#${g})"/>`};

const tira=(pts,c,w=2.5)=>{const xy=pts.map(q=>S(...q).join(',')).join(' ');
  return `<polyline points="${xy}" fill="none" stroke="${c}" stroke-width="${w*3}" opacity=".35" filter="url(#glow2)"/><polyline points="${xy}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;};

s+=tira([[0,D,H-6],[0,0,H-6]],LILA,2)+tira([[0,0,H-6],[W,0,H-6]],AZUL,2);

/* ===== vista: en celular vertical la habitación se agranda y se recorre deslizando ===== */
const VB={x0:30,x1:760,y0:56,y1:754};
const VISTA={zoom:false,x:30,w:730};
function ajustarVista(){
  const s=document.getElementById('cuarto');const R=s.parentElement.getBoundingClientRect();
  const movil=matchMedia('(max-width:700px) and (orientation:portrait)').matches;
  const H=VB.y1-VB.y0;
  if(movil&&R.width&&R.height){
    const k=Math.min(R.height/H,R.width/575);            // llena el alto, sin recortar más de lo necesario
    const w=Math.min(VB.x1-VB.x0,R.width/k);VISTA.zoom=w<VB.x1-VB.x0-4;VISTA.w=w;
    if(!VISTA.ini){VISTA.x=VB.x0+(VB.x1-VB.x0-w)/2;VISTA.ini=1;}
    VISTA.x=Math.max(VB.x0,Math.min(VB.x1-w,VISTA.x));
    s.setAttribute('viewBox',`${VISTA.x.toFixed(1)} ${VB.y0} ${w.toFixed(1)} ${H}`);
  }else{VISTA.zoom=false;s.setAttribute('viewBox',`${VB.x0} ${VB.y0} ${VB.x1-VB.x0} ${H}`);}
  s.classList.toggle('zoom',VISTA.zoom);
}
let PAN_RAF=0;
function panA(xDest){if(!VISTA.zoom)return;const s=document.getElementById('cuarto');xDest=Math.max(VB.x0,Math.min(VB.x1-VISTA.w,xDest));
  const x0=VISTA.x,t0=performance.now();cancelAnimationFrame(PAN_RAF);
  const f=now=>{const k=Math.min(1,(now-t0)/420),e=1-Math.pow(1-k,3);VISTA.x=x0+(xDest-x0)*e;s.setAttribute('viewBox',`${VISTA.x.toFixed(1)} ${VB.y0} ${VISTA.w.toFixed(1)} ${VB.y1-VB.y0}`);if(k<1)PAN_RAF=requestAnimationFrame(f);};
  PAN_RAF=requestAnimationFrame(f);}
function panAZona(k){if(!VISTA.zoom||!ZONAS[k])return;const [a]=S(...ZONAS[k].ancla);panA(a-VISTA.w/2);}
(function(){
  const s=document.getElementById('cuarto');let ini=null,mov=false;
  s.addEventListener('pointerdown',e=>{if(!VISTA.zoom||e.button>0)return;ini={x:e.clientX,y:e.clientY,vx:VISTA.x};mov=false;cancelAnimationFrame(PAN_RAF);});
  s.addEventListener('pointermove',e=>{if(!ini)return;const dx=e.clientX-ini.x;if(!mov&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(e.clientY-ini.y)){mov=true;s.classList.add('arrastrando');try{s.setPointerCapture(e.pointerId);}catch(_){}}
    if(mov){const k=s.getBoundingClientRect().width/VISTA.w;VISTA.x=Math.max(VB.x0,Math.min(VB.x1-VISTA.w,ini.vx-dx/k));s.setAttribute('viewBox',`${VISTA.x.toFixed(1)} ${VB.y0} ${VISTA.w.toFixed(1)} ${VB.y1-VB.y0}`);ocultarDesliza();}});
  const fin=()=>{if(mov){s.classList.remove('arrastrando');const bloquea=ev=>{ev.stopPropagation();ev.preventDefault();};document.addEventListener('click',bloquea,{capture:true,once:true});setTimeout(()=>document.removeEventListener('click',bloquea,{capture:true}),60);}ini=null;mov=false;};
  s.addEventListener('pointerup',fin);s.addEventListener('pointercancel',fin);
  addEventListener('resize',ajustarVista);addEventListener('orientationchange',()=>setTimeout(ajustarVista,250));
  ajustarVista();
  /* pista de "desliza" la primera vez */
  if(VISTA.zoom&&!localStorage.getItem('fambit_desliza')){const d=document.createElement('div');d.className='desliza';d.textContent='⇆ Desliza para ver todo';s.parentElement.style.position='relative';s.parentElement.appendChild(d);
    setTimeout(()=>d.classList.add('on'),600);setTimeout(ocultarDesliza,4200);}
})();

  {n:2,nom:'Activación',d:'Contenido pre-feria, ferias, descuento de lanzamiento, comunidad y colaboraciones.'},
  {n:3,nom:'Expansión',d:'Más productos, más diseños y nuevos canales.'},
  {n:4,nom:'Nuevo Producto',d:'Impresión 3D y ojitos / doming en figuras.'}
];
const XPS=[25,50,100,200,300];
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowISO=()=>new Date().toISOString();
const ddmm=f=>f?f.slice(8,10)+'/'+f.slice(5,7):'';
function cargarMis(){
  try{const d=JSON.parse(localStorage.getItem(MKEY)||'null');if(d&&Array.isArray(d.misiones))return d;}catch(e){}
  return {misiones:[],del:[]};
}
let MIS=cargarMis();
const UI={mundo:null,filtro:'pend',abierta:null};
function guardarMis(){try{lsSet(MKEY,JSON.stringify(MIS));}catch(e){toast('No se pudo guardar en este navegador');}pintarTodo();}
function tocar(m){m.actualizado=nowISO();}

/* ---- cálculos ---- */
const delMundo=n=>MIS.misiones.filter(m=>m.mundo===n);
function statMundo(n){const L=delMundo(n);const tot=L.reduce((a,m)=>a+(+m.xp||0),0),gan=L.filter(m=>m.hecha).reduce((a,m)=>a+(+m.xp||0),0);
  return {tot,gan,pct:tot?Math.round(gan/tot*100):0,n:L.length,hechas:L.filter(m=>m.hecha).length};}
const completo=n=>{const s=statMundo(n);return s.n>0&&s.pct===100;};
function mundoActual(){for(const w of MUNDOS)if(!completo(w.n))return w.n;return 4;}
const bloqueado=n=>{if(n<2)return false;const s=statMundo(n-1);return !(s.n>0&&s.pct>=80);};
const ordenPend=(a,b)=>(a.fecha||'9999').localeCompare(b.fecha||'9999')||(a.creado||'').localeCompare(b.creado||'');

/* ---- pantalla del cuarto en vivo ---- */
function pintarPantalla(){
  const g=document.getElementById('pantMis');if(!g)return;
  const n=mundoActual(),st=statMundo(n);
  const pend=delMundo(n).filter(m=>!m.hecha).sort(ordenPend);
  const hechas=delMundo(n).filter(m=>m.hecha).sort((a,b)=>(b.tsHecha||0)-(a.tsHecha||0));
  const filas=[...pend.slice(0,3),...hechas].slice(0,3);
  const corta=s=>s.length>24?s.slice(0,23).trimEnd()+'…':s;
  const w=Math.max(0,Math.min(86,86*st.pct/100));
  let r=`<rect x="-5" y="-5" width="142" height="100" rx="6" fill="${NEGRO}"/>
  <rect x="0" y="0" width="132" height="90" rx="3" fill="#0A0D3D"/>
  <rect x="0" y="0" width="132" height="14" rx="3" fill="#161B66"/>
  <path d="M6 4 l6 3.5 l-6 3.5z" fill="${AMARILLO}"/>
  <text x="16" y="10.5" font-family="${FT}" font-weight="700" font-size="7.5" fill="${AMARILLO}" letter-spacing=".5">MISIONES</text>
  <text x="126" y="10.5" text-anchor="end" font-family="${FX}" font-weight="700" font-size="6" fill="#8F8BFF">MUNDO ${n} · E${n}</text>
  <text x="6" y="24" font-family="${FT}" font-weight="700" font-size="5.5" fill="#C4C6F5">XP</text>
  <rect x="17" y="19.5" width="86" height="5" rx="2.5" fill="#1B2063"/>
  <rect x="17" y="19.5" width="${w.toFixed(1)}" height="5" rx="2.5" fill="${LILA}"/>${w>3?`<rect x="${(17+w-3).toFixed(1)}" y="19.5" width="3" height="5" rx="1.5" fill="${AMARILLO}"/>`:''}
  <text x="126" y="24.5" text-anchor="end" font-family="${FT}" font-weight="700" font-size="5.5" fill="#fff">${st.pct}%</text>
  <g font-family="${FX}" font-weight="700" font-size="6.3">`;
  filas.forEach((m,i)=>{const y=31+i*18,prio=!m.hecha&&i===0;
    r+=`<rect x="5" y="${y}" width="122" height="15" rx="3" fill="#13185A" ${prio?`stroke="${AMARILLO}" stroke-width=".8"`:''}/>`;
    if(m.hecha)r+=`<rect x="9" y="${y+3.5}" width="8" height="8" rx="2" fill="${LILA}"/><path d="M10.8 ${y+7.6} l2 2 l3 -3.8" stroke="#fff" stroke-width="1.3" fill="none"/>`;
    else if(prio)r+=`<rect x="9" y="${y+3.5}" width="8" height="8" rx="2" fill="none" stroke="${AMARILLO}" stroke-width="1.2"/>`;
    else r+=`<rect x="9" y="${y+3.5}" width="8" height="8" rx="2" fill="none" stroke="#8F8BFF" stroke-width="1"/>`;
    const col=m.hecha?'#8F8BFF':prio?'#fff':'#C4C6F5';
    r+=`<text x="22" y="${y+10}" fill="${col}" ${m.hecha?'text-decoration="line-through"':''}>${esc(corta(m.titulo))}</text><text x="122" y="${y+10}" text-anchor="end" fill="${prio?AMARILLO:col}">+${m.xp}</text>`;});
  if(!filas.length)r+=`<rect x="5" y="31" width="122" height="51" rx="4" fill="none" stroke="#3A3F9E" stroke-width=".8" stroke-dasharray="3 2"/>
    <text x="66" y="52" text-anchor="middle" fill="#C4C6F5" font-size="7">Sin misiones aún</text>
    <rect x="38" y="59" width="56" height="13" rx="6.5" fill="${AMARILLO}"/><text x="66" y="68" text-anchor="middle" fill="${NAVY}" font-family="${FT}" font-size="6">+ Crear la primera</text>`;
  g.innerHTML=r+'</g>';
  const tag=document.getElementById('tagMundo');if(tag)tag.textContent='MUNDO '+n;
  const dk=document.getElementById('dkMis');if(dk){const p=MIS.misiones.filter(m=>!m.hecha&&m.mundo===n).length;dk.textContent=!MIS.misiones.length?'Sin misiones':p?p+(p===1?' activa':' activas'):'Al día';}
}

/* ---- panel ---- */
const misAbierto=()=>document.getElementById('mis').classList.contains('on');
const sinMov=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let misAnim=null;
function rectPantalla(){const o=document.querySelector('.obj[data-z="misiones"]');const r=o&&o.getBoundingClientRect();return r&&r.width?r:null;}
/* la pantalla del cuarto se enciende y el panel "sale" de ella como un monitor CRT */
function animCaja(abrir,fin){
  const caja=document.querySelector('.mis-caja');if(misAnim){misAnim.cancel();misAnim=null;}
  const rp=rectPantalla();
  if(sinMov()||!rp||!caja.animate){fin&&fin();return;}
  const rc=caja.getBoundingClientRect();
  const dx=(rp.left+rp.width/2)-(rc.left+rc.width/2),dy=(rp.top+rp.height/2)-(rc.top+rc.height/2),s=Math.max(.08,rp.width/rc.width);
  const K=[{transform:`translate(${dx}px,${dy}px) scale(${s})`,opacity:0,filter:'brightness(2.4)'},
           {transform:'translate(0,0) scale(1,.012)',opacity:1,filter:'brightness(3)',offset:.42},
           {transform:'none',opacity:1,filter:'brightness(1)'}];
  misAnim=caja.animate(abrir?K:K.slice().reverse().map((k,i)=>({...k,offset:i===1?.58:undefined})),{duration:abrir?620:460,easing:abrir?'cubic-bezier(.2,.8,.2,1)':'cubic-bezier(.6,0,.8,.4)',fill:'forwards'});
  misAnim.onfinish=()=>{if(abrir){misAnim.cancel();misAnim=null;}fin&&fin();};
}
function abrirMisiones(desdeCuarto){
  if(UI.mundo==null)UI.mundo=mundoActual();
  if(location.hash!=='#misiones')history.pushState(null,'','#misiones');
  const el=document.getElementById('mis'),caja=el.querySelector('.mis-caja');
  const mostrar=()=>{
    pintarPanel();
    caja.classList.remove('boot');void caja.offsetWidth;if(!sinMov())caja.classList.add('boot');
    el.classList.add('on');el.setAttribute('aria-hidden','false');
    animCaja(true,()=>setTimeout(()=>caja.classList.remove('boot'),700));
    fbPull(true);
  };
  const o=document.querySelector('.obj[data-z="misiones"]');
  if(desdeCuarto&&o&&!sinMov()){o.classList.remove('encender');void o.getBoundingClientRect();o.classList.add('encender');setTimeout(()=>{mostrar();o.classList.remove('encender');},380);}
  else mostrar();
}
function cerrarMisiones(){
  if(location.hash==='#misiones'){history.back();return;}
  ocultarMisiones();
}
function ocultarMisiones(){const el=document.getElementById('mis');cerrarForm();el.classList.add('saliendo');animCaja(false,()=>{el.classList.remove('on','saliendo');el.setAttribute('aria-hidden','true');if(misAnim){misAnim.cancel();misAnim=null;}});}
window.addEventListener('popstate',()=>{if(location.hash==='#misiones'){if(!misAbierto())abrirMisiones();}else if(misAbierto())ocultarMisiones();});

function pintarTodo(){pintarPantalla();if(misAbierto())pintarPanel();}
function pintarPanel(){
  const totXP=MIS.misiones.filter(m=>m.hecha).reduce((a,m)=>a+(+m.xp||0),0);
  document.getElementById('misTot').textContent=totXP.toLocaleString('es-CO')+' XP';
  document.getElementById('misMundos').innerHTML=MUNDOS.map(w=>{const s=statMundo(w.n),lk=bloqueado(w.n);
    return `<button class="mm ${UI.mundo===w.n?'on':''} ${lk?'lock':''} ${s.pct===100&&s.n?'full':''}" data-mundo="${w.n}"><small>${lk?'🔒 ':''}MUNDO ${w.n}</small><b>${w.nom}</b><div class="bar"><i style="width:${s.pct}%"></i></div><span class="pc">${s.pct===100&&s.n?'🏆':s.pct+'%'}</span></button>`;}).join('');
  const w=MUNDOS[UI.mundo-1],s=statMundo(w.n);
  let L=delMundo(w.n);
  const nP=L.filter(m=>!m.hecha).length,nH=L.length-nP;
  if(UI.filtro==='pend')L=L.filter(m=>!m.hecha).sort(ordenPend);
  else if(UI.filtro==='hecha')L=L.filter(m=>m.hecha).sort((a,b)=>(b.tsHecha||0)-(a.tsHecha||0));
  else L=[...L.filter(m=>!m.hecha).sort(ordenPend),...L.filter(m=>m.hecha)];
  const prioId=(L.find(m=>!m.hecha)||{}).id;
  let h=`<div class="mh"><div><h3>E${w.n} · ${w.nom}</h3><p>${w.d}</p></div><div class="xpbig"><b>${s.gan.toLocaleString('es-CO')}</b><span>de ${s.tot.toLocaleString('es-CO')} XP</span></div></div>
  <div class="xpbar"><i style="width:${s.pct}%"></i></div>`;
  if(bloqueado(w.n))h+=`<div class="aviso">🔒 Este mundo se desbloquea al llegar al 80% del Mundo ${w.n-1}. Puedes ir planeando sus misiones.</div>`;
  h+=`<div class="chips"><button class="chip ${UI.filtro==='pend'?'on':''}" data-filtro="pend">Pendientes · ${nP}</button><button class="chip ${UI.filtro==='hecha'?'on':''}" data-filtro="hecha">Completadas · ${nH}</button><button class="chip ${UI.filtro==='todas'?'on':''}" data-filtro="todas">Todas</button></div>`;
  h+=L.length?L.map(m=>tarjeta(m,m.id===prioId)).join(''):(!nP&&!nH?`<div class="vacio grande"><div class="vic">📌</div><b>Mundo ${w.n} sin misiones</b><span>Crea la primera misión de ${w.nom} con su recompensa de XP y sus pasos.</span><button class="vbtn" data-nueva="1">+ Nueva misión</button></div>`:`<div class="vacio">${UI.filtro==='pend'?'🏆 No quedan misiones pendientes en este mundo.':'Nada por aquí todavía.'}</div>`);
  document.getElementById('misCuerpo').innerHTML=h;
}
function tarjeta(m,prio){
  const venc=!m.hecha&&m.fecha&&m.fecha<hoyISO();
  const pOk=(m.pasos||[]).filter(p=>p.ok).length,pT=(m.pasos||[]).length;
  const abre=UI.abierta===m.id;
  let h=`<div class="mc ${m.hecha?'ok':''} ${prio?'prio':''}" data-id="${m.id}">
    <button class="mc-chk" data-act="chk" aria-label="Completar">${m.hecha?'✓':''}</button>
    <div class="mc-tx" data-act="abrir"><b>${esc(m.titulo)}</b><div class="mc-meta"><span class="xp">+${m.xp} XP</span>${m.fecha?`<span class="${venc?'venc':''}">📅 ${ddmm(m.fecha)}${venc?' · vencida':''}</span>`:''}${pT?`<span>☑ ${pOk}/${pT}</span>`:''}</div>`;
  if(m.meta>0){const pc=Math.min(100,Math.round((+m.actual||0)/m.meta*100));h+=`<div class="prog"><div class="bar"><i style="width:${pc}%"></i></div><span>${(+m.actual||0).toLocaleString('es-CO')} / ${(+m.meta).toLocaleString('es-CO')} ${esc(m.unidad||'')}</span></div>`;}
  h+=`</div><button class="mc-gear" data-act="edit" aria-label="Editar">⚙</button>`;
  if(abre&&(pT||m.meta>0)){
    h+=`<div class="mc-det">`;
    (m.pasos||[]).forEach((p,i)=>{h+=`<div class="paso ${p.ok?'ok':''}" data-act="paso" data-i="${i}"><i>${p.ok?'✓':''}</i><span>${esc(p.t)}</span></div>`;});
    if(m.meta>0)h+=`<div class="avance">Avance: <button data-act="menos">−</button><input type="number" inputmode="numeric" data-act="actual" value="${+m.actual||0}"><button data-act="mas">+</button><span>de ${(+m.meta).toLocaleString('es-CO')} ${esc(m.unidad||'')}</span></div>`;
    h+=`</div>`;
  }
  return h+`</div>`;
}
function xpVuela(el,txt){const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='xpfly';f.textContent=txt;f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1150);}
function completar(m,btn){
  const antes=statMundo(m.mundo).pct;
  m.hecha=!m.hecha;m.tsHecha=m.hecha?Date.now():0;tocar(m);
  if(m.hecha){xpVuela(btn,'+'+m.xp+' XP');if(m.meta>0&&(+m.actual||0)<m.meta)m.actual=m.meta;}
  guardarMis();
  const s=statMundo(m.mundo);
  if(m.hecha&&s.pct===100&&antes<100)toast('🏆 ¡Mundo '+m.mundo+' completado!');
  else if(m.hecha&&m.mundo<4&&s.pct>=80&&antes<80)toast('🔓 Mundo '+(m.mundo+1)+' desbloqueado');
}
document.getElementById('misVolver').addEventListener('click',cerrarMisiones);
document.getElementById('mis').addEventListener('click',e=>{if(e.target.id==='mis')cerrarMisiones();});
document.getElementById('misMundos').addEventListener('click',e=>{const b=e.target.closest('.mm');if(!b)return;UI.mundo=+b.dataset.mundo;UI.abierta=null;pintarPanel();document.getElementById('misCuerpo').scrollTop=0;});
document.getElementById('misNueva').addEventListener('click',()=>abrirForm(null));
document.getElementById('misCuerpo').addEventListener('click',e=>{
  if(e.target.closest('[data-nueva]')){abrirForm(null);return;}
  const f=e.target.closest('[data-filtro]');if(f){UI.filtro=f.dataset.filtro;pintarPanel();return;}
  const a=e.target.closest('[data-act]');if(!a)return;const card=a.closest('.mc');if(!card)return;
  const m=MIS.misiones.find(x=>x.id===card.dataset.id);if(!m)return;const act=a.dataset.act;
  if(act==='chk')completar(m,a);
  else if(act==='abrir'){UI.abierta=UI.abierta===m.id?null:m.id;if(!(m.pasos||[]).length&&!(m.meta>0)){UI.abierta=null;abrirForm(m);return;}pintarPanel();}
  else if(act==='edit')abrirForm(m);
  else if(act==='paso'){const p=m.pasos[+a.dataset.i];p.ok=!p.ok;tocar(m);guardarMis();}
  else if(act==='mas'||act==='menos'){m.actual=Math.max(0,(+m.actual||0)+(act==='mas'?1:-1)*(m.meta>=500?10:1));tocar(m);guardarMis();}
});
document.getElementById('misCuerpo').addEventListener('change',e=>{
  if(e.target.dataset.act!=='actual')return;const m=MIS.misiones.find(x=>x.id===e.target.closest('.mc').dataset.id);if(!m)return;
  m.actual=Math.max(0,parseInt(e.target.value,10)||0);tocar(m);guardarMis();
  if(m.meta>0&&m.actual>=m.meta&&!m.hecha)toast('🎯 Meta alcanzada: márcala como completada');
});

/* ---- formulario nueva / editar ---- */
let EDIT=null;
function abrirForm(m){
  EDIT=m;const v=m||{mundo:UI.mundo||mundoActual(),titulo:'',xp:100,fecha:'',meta:0,unidad:'',pasos:[]};
  const F=document.getElementById('misForm');
  F.innerHTML=`<div class="mf">
    <h3>${m?'⚙ Editar misión':'+ Nueva misión'}</h3>
    <label>Misión</label><input id="fTit" maxlength="80" placeholder="Ej: Grabar 3 reels de Demon Slayer" value="${esc(v.titulo)}">
    <label>Mundo</label><select id="fMun">${MUNDOS.map(w=>`<option value="${w.n}" ${w.n===v.mundo?'selected':''}>E${w.n} · ${w.nom}</option>`).join('')}</select>
    <label>Recompensa</label><div class="xps">${XPS.map(x=>`<button type="button" class="chip ${+v.xp===x?'on':''}" data-xp="${x}">+${x} XP</button>`).join('')}</div>
    <div class="fila"><div><label>Fecha límite</label><input id="fFec" type="date" value="${v.fecha||''}"></div>
    <div><label>Meta numérica</label><div style="display:flex;gap:6px"><input id="fMeta" type="number" inputmode="numeric" min="0" placeholder="Ej: 2000" value="${v.meta||''}"><input id="fUni" placeholder="unid." style="width:70px;flex:none" value="${esc(v.unidad||'')}"></div></div></div>
    <label>Pasos</label><textarea id="fPasos" rows="4" placeholder="Un paso por línea (opcional)">${esc((v.pasos||[]).map(p=>p.t).join('\n'))}</textarea>
    <div class="ayuda">Los pasos aparecen como checklist al tocar la misión.</div>
    <div class="acc"><button class="no" type="button" id="fNo">Cancelar</button><button class="ok" type="button" id="fOk">${m?'Guardar':'Crear misión'}</button></div>
    ${m?`<button class="borrar" type="button" id="fDel">Eliminar misión</button>`:''}
  </div>`;
  F.dataset.xp=v.xp;F.classList.add('on');
  if(!m)setTimeout(()=>document.getElementById('fTit').focus(),60);
}
function cerrarForm(){const F=document.getElementById('misForm');F.classList.remove('on');F.innerHTML='';EDIT=null;}
document.getElementById('misForm').addEventListener('click',e=>{
  const F=document.getElementById('misForm');
  if(e.target===F){cerrarForm();return;}
  const x=e.target.closest('.chip[data-xp]');if(x){F.dataset.xp=x.dataset.xp;F.querySelectorAll('[data-xp]').forEach(b=>b.classList.toggle('on',b===x));return;}
  if(e.target.id==='fNo'){cerrarForm();return;}
  if(e.target.id==='fDel'){if(!EDIT||!confirm('¿Eliminar la misión "'+EDIT.titulo+'"?'))return;
    MIS.misiones=MIS.misiones.filter(m=>m.id!==EDIT.id);MIS.del=[...(MIS.del||[]),{id:EDIT.id,ts:Date.now()}];cerrarForm();guardarMis();toast('Misión eliminada');return;}
  if(e.target.id==='fOk'){
    const tit=document.getElementById('fTit').value.trim();if(!tit){document.getElementById('fTit').focus();return;}
    const textos=document.getElementById('fPasos').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const prev=EDIT?EDIT.pasos||[]:[];
    const datos={titulo:tit,mundo:+document.getElementById('fMun').value,xp:+F.dataset.xp||100,
      fecha:document.getElementById('fFec').value,meta:Math.max(0,parseInt(document.getElementById('fMeta').value,10)||0),unidad:document.getElementById('fUni').value.trim(),
      pasos:textos.map(t=>({t,ok:!!(prev.find(p=>p.t===t)||{}).ok}))};
    if(EDIT){Object.assign(EDIT,datos);tocar(EDIT);}
    else{MIS.misiones.push({id:uid(),actual:0,hecha:false,creado:nowISO(),actualizado:nowISO(),...datos});UI.filtro='pend';}
    UI.mundo=datos.mundo;const nuevo=!EDIT;cerrarForm();guardarMis();toast(nuevo?'📌 Misión creada':'Cambios guardados');
  }
});
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200);}

/* ---- sincronización (Firestore · colección fambit-hub, mismo esquema que Mercante) ---- */
const FB='https://firestore.googleapis.com/v1/projects/cosmo-98107/databases/(default)/documents/fambit-hub/';
const SYNC_KEYS=[MKEY];
const OUTBOX='fambit_outbox';
const obLoad=()=>{try{return JSON.parse(localStorage.getItem(OUTBOX)||'{}')||{};}catch(e){return {};}};
const obSave=o=>{try{localStorage.setItem(OUTBOX,JSON.stringify(o));}catch(e){}};
const obMio=()=>Object.keys(obLoad()).filter(k=>SYNC_KEYS.includes(k));
const fbPend={},fbT={};
function lsSet(key,val){localStorage.setItem(key,val);if(SYNC_KEYS.includes(key))fbSave(key,val);}
function fbSave(key,val){const o=obLoad();o[key]={v:val,ts:Date.now()};obSave(o);fbPend[key]=val;clearTimeout(fbT[key]);fbT[key]=setTimeout(()=>fbFlush(key),900);syncDot('run');}
function fbFlush(key){
  let val;if(key in fbPend){val=fbPend[key];delete fbPend[key];}else{const o=obLoad();if(!o[key])return;val=o[key].v;}
  const ts=Date.now();
  return fetch(FB+encodeURIComponent(key)+'?updateMask.fieldPaths=data&updateMask.fieldPaths=updatedAt',{method:'PATCH',headers:{'Content-Type':'application/json'},keepalive:true,
    body:JSON.stringify({fields:{data:{stringValue:val},updatedAt:{integerValue:String(ts)}}})})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);localStorage.setItem('__ts_'+key,String(ts));
    const o=obLoad();if(o[key]&&o[key].v===val){delete o[key];obSave(o);}

/* ---- Banco: utilidad del mes (solo lectura de Banco, Mercante y Señal locales) ---- */
function utilidadMes(){
  const J=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')||{};}catch(e){return {};}};
  const B=J('fambit_banco_v1'),M=J('fambit_mercante_v2'),S=J('fambit_senal_v1');const mes=new Date().toISOString().slice(0,7);
  const md=x=>{const d=new Date(x);return isNaN(d)?String(x||'').slice(0,7):d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
  const del=new Set((M.del||[]).map(d=>d&&d.id));let ing=0,gas=0;
  (M.pedidos||[]).filter(p=>!del.has(p.id)).forEach(p=>{const log=(p.pagos||[]);log.forEach(x=>{if(md(x.fecha)===mes)ing+=+x.monto||0;});
    const T=+p._total||0,ep=p.estadoPago,pag=ep==='pagado'?T:ep==='abonado'?(T?Math.min(+p.abonado||0,T):+p.abonado||0):0,dif=pag-log.reduce((a,x)=>a+(+x.monto||0),0);
    if(Math.abs(dif)>=1&&md(dif>0?(p.creado||p.actualizado):p.actualizado)===mes)ing+=dif;});
  (B.movs||[]).forEach(m=>{if(md(m.fecha)!==mes)return;if(m.tipo==='ingreso')ing+=+m.monto||0;if(m.tipo==='gasto')gas+=+m.monto||0;});
  if(!B.ajustes||B.ajustes.pautaAuto!==false)(S.items||[]).forEach(i=>{if(i.pauta&&i.pauta.si&&+i.pauta.inversion&&md(i.tsPub||i.creado)===mes)gas+=+i.pauta.inversion;});
  /* saldo total (todas las fechas) */
  let sal=(B.cuentas||[{ini:0}]).reduce((a,c)=>a+(+c.ini||0),0);
  (M.pedidos||[]).filter(p=>!del.has(p.id)).forEach(p=>{const T=+p._total||0,ep=p.estadoPago;sal+=ep==='pagado'?(T||(p.pagos||[]).reduce((a,x)=>a+(+x.monto||0),0)):ep==='abonado'?(T?Math.min(+p.abonado||0,T):+p.abonado||0):0;});
  (B.movs||[]).forEach(m=>{const v=+m.monto||0;if(m.tipo==='ingreso'||m.tipo==='aporte')sal+=v;if(m.tipo==='gasto'||m.tipo==='retiro')sal-=v;});
  if(!B.ajustes||B.ajustes.pautaAuto!==false)(S.items||[]).forEach(i=>{if(i.pauta&&i.pauta.si&&+i.pauta.inversion)sal-=+i.pauta.inversion;});
  return {ing,gas,u:ing-gas,sal};
}
